<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
    <link rel="stylesheet" href="../style.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

</head>
<body>
    <!-- 粒子背景画布（保持不变） -->
    <canvas id="particle-canvas"></canvas>

    <!-- 顶部主标题（复用 .site-title 的风格，但用新类名避免冲突） -->

    <!-- 副标题/简介 -->
    <p class="contact-intro">在下面找我(👇▼﹏▼👇)</p>

    <!-- 联系方式列表 -->
    <div class="contact-links">
        <a href="https://github.com/wfy-coder" target="_blank" class="contact-card">
    <div class="icon">
        <!-- 网上加载 GitHub 图标 -->
        <iconify-icon icon="bi:github" width="28" height="28"></iconify-icon>
    </div>
    <div class="text">
        <div class="name">GitHub</div>
        <div class="handle">给我点⭐</div>
    </div>
</a>

<a href="https://space.bilibili.com/3546981198727447" target="_blank" class="contact-card">
    <div class="icon">
        <!-- 网上加载 Bilibili 图标 -->
        <iconify-icon icon="ri:bilibili-line" width="28" height="28"></iconify-icon>
    </div>
    <div class="text">
        <div class="name">Bilibili</div>
        <div class="handle">催更</div>
    </div>
</a>

    </div>

    <div class="btn-caption">这个页面和主站设计稍有不同,你喜欢吗?</div>

    <!-- 星空星座脚本（整体移动 + 自身随机游荡） -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;
        const PARTICLE_COUNT = 120; 
        
        // 记录鼠标位置
        const mouse = { x: null, y: null };
        // 全局移动速度
        let globalVx = 0, globalVy = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 1.5 + 0.5, 
                    alpha: Math.random(), 
                    alphaSpeed: (Math.random() * 0.02) + 0.005,
                    // 新增：每颗星星自己的随机游荡速度
                    vx: (Math.random() - 0.5) * 0.3, 
                    vy: (Math.random() - 0.5) * 0.3  
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // 计算鼠标对星空的全局牵引力
            if (mouse.x !== null && mouse.y !== null) {
                const targetVx = (mouse.x - width / 2) * 0.001;
                const targetVy = (mouse.y - height / 2) * 0.001;
                globalVx += (targetVx - globalVx) * 0.05;
                globalVy += (targetVy - globalVy) * 0.05;
            } else {
                globalVx *= 0.95;
                globalVy *= 0.95;
            }

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                // 1. 全局平移 + 自身随机游荡
                p.x += globalVx + p.vx;
                p.y += globalVy + p.vy;
                
                // 无限宇宙：穿过边界从另一侧出现
                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;
                if (p.y < -10) p.y = height + 10;
                if (p.y > height + 10) p.y = -10;
                
                // 2. 星星闪烁逻辑
                p.alpha += p.alphaSpeed;
                if (p.alpha > 1) {
                    p.alpha = 1;
                    p.alphaSpeed *= -1; 
                } else if (p.alpha < 0.2) {
                    p.alpha = 0.2;
                    p.alphaSpeed *= -1; 
                }
                
                // 画星星
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();

                // 3. 画星座连线
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 110) { 
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        const lineAlpha = 0.2 * (1 - dist / 110) * (p.alpha * 0.5 + 0.5);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${lineAlpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
        });

        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });

        resize();
        initParticles();
        draw();
    </script>



</body>
</html>
