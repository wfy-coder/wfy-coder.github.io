<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裂痕守护者</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;
  --fg:#f0e6d2;
  --muted:#8a8580;
  --accent:#ffa726;
  --accent2:#1de9b6;
  --danger:#ff3d00;
  --gold:#ffd54f;
  --card:rgba(15,20,35,0.88);
  --border:rgba(255,167,38,0.35);
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--fg)}
#canvas-container{position:fixed;inset:0;z-index:0}
canvas{display:block}

/* === 通用覆盖层 === */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(10,14,26,0.7) 0%,rgba(10,14,26,0.95) 100%);
  backdrop-filter:blur(8px)}
.overlay.hidden{display:none}

/* === 主菜单 === */
.menu-content{text-align:center;max-width:760px;padding:40px;position:relative}
.menu-content::before{content:'';position:absolute;inset:-2px;
  background:linear-gradient(135deg,transparent 30%,rgba(255,167,38,0.1) 50%,transparent 70%);
  pointer-events:none;animation:shimmer 8s linear infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.title-block{margin-bottom:30px}
h1{font-family:'Cinzel',serif;font-size:clamp(48px,8vw,96px);font-weight:900;letter-spacing:8px;
  background:linear-gradient(180deg,#ffe7b3 0%,#ffa726 50%,#c67000 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 60px rgba(255,167,38,0.3);line-height:1}
.subtitle{font-family:'Cinzel',serif;font-size:16px;letter-spacing:12px;color:var(--accent2);
  margin-top:8px;opacity:0.85}
.story{font-size:17px;line-height:1.8;color:#c8c0b0;margin:30px 0;
  padding:20px 24px;background:rgba(255,167,38,0.05);border-left:3px solid var(--accent);
  text-align:left}
.story p{margin-bottom:10px}
.story p:last-child{margin-bottom:0;color:var(--accent2);font-style:italic}

.btn{font-family:'Cinzel',serif;font-size:18px;font-weight:700;letter-spacing:4px;
  padding:14px 42px;background:linear-gradient(180deg,rgba(255,167,38,0.15),rgba(255,167,38,0.05));
  border:1.5px solid var(--accent);color:var(--accent);cursor:pointer;
  position:relative;transition:all 0.3s;overflow:hidden;text-transform:uppercase}
.btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,167,38,0.3),rgba(255,167,38,0.1));
  transform:translateY(100%);transition:transform 0.3s}
.btn:hover{color:#fff;box-shadow:0 0 30px rgba(255,167,38,0.5),inset 0 0 20px rgba(255,167,38,0.2)}
.btn:hover::before{transform:translateY(0)}
.btn span{position:relative;z-index:1}
.btn-secondary{border-color:var(--accent2);color:var(--accent2)}
.btn-secondary::before{background:linear-gradient(180deg,rgba(29,233,182,0.3),rgba(29,233,182,0.1))}
.btn-secondary:hover{box-shadow:0 0 30px rgba(29,233,182,0.5),inset 0 0 20px rgba(29,233,182,0.2)}

.btn-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* === 关卡选择 === */
.level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;
  max-width:960px;margin-top:30px;max-height:55vh;overflow-y:auto;padding:4px}
.level-card{padding:20px;background:var(--card);border:1px solid var(--border);cursor:pointer;
  transition:all 0.3s;position:relative;overflow:hidden;min-height:180px}
.level-card:hover{transform:translateY(-4px);border-color:var(--accent);
  box-shadow:0 10px 40px rgba(255,167,38,0.2)}
.level-card.locked{opacity:0.4;cursor:not-allowed}
.level-card.locked:hover{transform:none;box-shadow:none}
.level-num{font-family:'Cinzel',serif;font-size:12px;color:var(--accent2);letter-spacing:3px}
.level-name{font-family:'Cinzel',serif;font-size:20px;font-weight:700;margin:6px 0 3px;color:var(--fg)}
.level-sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.level-info{font-size:12px;color:#c8c0b0;line-height:1.4}
.level-preview{height:60px;margin-bottom:12px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1a1f30,#0f1420);border-radius:4px}
.preview-1{background:linear-gradient(135deg,#4a7c3a,#2d5028)}
.preview-2{background:linear-gradient(135deg,#c9923d,#7a5520)}
.preview-3{background:linear-gradient(135deg,#8b1a1a,#2a0808)}
.preview-4{background:linear-gradient(135deg,#b0d8f0,#3a6080)}
.preview-5{background:linear-gradient(135deg,#3a5a2a,#1a2a10)}
.preview-6{background:linear-gradient(135deg,#b088c8,#4a3060)}
.preview-7{background:linear-gradient(135deg,#6a8090,#2a3a50)}
.preview-8{background:linear-gradient(135deg,#4a1a6a,#1a0a2a)}
.preview-9{background:linear-gradient(135deg,#c8a050,#5a3a1a)}
.preview-10{background:linear-gradient(135deg,#1a0000,#0a0000);box-shadow:inset 0 0 20px rgba(255,20,0,0.3)}

/* === HUD === */
#hud{position:fixed;inset:0;z-index:50;pointer-events:none}
#hud.hidden{display:none}
.hud-top{position:absolute;top:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;background:var(--card);padding:10px 20px;
  border:1px solid var(--border);pointer-events:auto;
  backdrop-filter:blur(10px);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
.hud-stat{display:flex;align-items:center;gap:8px;padding:0 16px;
  font-family:'Cinzel',serif;font-size:18px;font-weight:700}
.hud-stat:not(:last-child){border-right:1px solid rgba(255,167,38,0.2)}
.stat-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.stat-icon svg{width:100%;height:100%}
#gold-val{color:var(--gold)}
#lives-val{color:var(--danger)}
#wave-val{color:var(--accent2)}

.hud-right{position:absolute;top:20px;right:20px;display:flex;gap:8px;pointer-events:auto}
.hud-btn{width:44px;height:44px;background:var(--card);border:1px solid var(--border);
  color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;backdrop-filter:blur(10px)}
.hud-btn:hover{border-color:var(--accent);color:var(--accent)}
.hud-btn svg{width:20px;height:20px}

.tower-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;background:var(--card);padding:12px;
  border:1px solid var(--border);pointer-events:auto;backdrop-filter:blur(10px)}
.tower-btn{width:72px;height:88px;background:rgba(255,255,255,0.03);
  border:1.5px solid rgba(255,167,38,0.2);cursor:pointer;position:relative;
  transition:all 0.2s;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:6px}
.tower-btn:hover{border-color:var(--accent);background:rgba(255,167,38,0.1);transform:translateY(-3px)}
.tower-btn.selected{border-color:var(--accent);background:rgba(255,167,38,0.15);
  box-shadow:0 0 20px rgba(255,167,38,0.4)}
.tower-btn.unaffordable{opacity:0.4;pointer-events:none}
.tower-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.tower-icon svg{width:100%;height:100%}
.tower-name{font-size:11px;color:var(--fg);font-weight:600}
.tower-cost{font-size:11px;color:var(--gold);font-weight:700;
  font-family:'Cinzel',serif;display:flex;align-items:center;gap:2px}

#tower-panel{position:absolute;right:20px;top:80px;width:240px;background:var(--card);
  border:1px solid var(--border);padding:16px;pointer-events:auto;
  backdrop-filter:blur(10px);transform:translateX(280px);transition:transform 0.3s}
#tower-panel.show{transform:translateX(0)}
.tp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tp-name{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--accent)}
.tp-level{font-size:12px;color:var(--accent2);padding:2px 8px;
  border:1px solid var(--accent2);border-radius:2px}
.tp-close{width:24px;height:24px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--muted);transition:color 0.2s}
.tp-close:hover{color:var(--danger)}
.tp-stats{font-size:13px;line-height:1.8;margin-bottom:14px}
.tp-stat{display:flex;justify-content:space-between}
.tp-stat-val{color:var(--accent2);font-weight:600}
.tp-upgrade{font-size:12px;color:var(--muted);margin-bottom:14px;
  padding:8px;background:rgba(255,255,255,0.03);border-left:2px solid var(--accent2)}
.tp-actions{display:flex;gap:8px}
.tp-btn{flex:1;padding:8px;background:rgba(255,167,38,0.1);border:1px solid var(--accent);
  color:var(--accent);cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;
  font-size:13px;transition:all 0.2s}
.tp-btn:hover:not(:disabled){background:rgba(255,167,38,0.2);color:#fff}
.tp-btn:disabled{opacity:0.4;cursor:not-allowed}
.tp-btn.sell{border-color:var(--danger);color:var(--danger);background:rgba(255,61,0,0.1)}
.tp-btn.sell:hover{background:rgba(255,61,0,0.2);color:#fff}

#wave-control{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);
  pointer-events:auto;display:flex;align-items:center;gap:12px}
.start-wave-btn{font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:3px;
  padding:10px 28px;background:linear-gradient(180deg,rgba(29,233,182,0.2),rgba(29,233,182,0.05));
  border:1.5px solid var(--accent2);color:var(--accent2);cursor:pointer;
  transition:all 0.3s;position:relative;overflow:hidden}
.start-wave-btn:hover{color:#fff;box-shadow:0 0 30px rgba(29,233,182,0.5)}
.start-wave-btn:disabled{opacity:0.4;cursor:not-allowed}
.wave-info{font-size:13px;color:var(--muted);background:var(--card);padding:8px 14px;
  border:1px solid var(--border)}

#loading{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:var(--bg);flex-direction:column;gap:20px}
.loading-text{font-family:'Cinzel',serif;font-size:14px;letter-spacing:6px;color:var(--accent)}
.loading-bar{width:240px;height:2px;background:rgba(255,167,38,0.2);overflow:hidden}
.loading-fill{height:100%;background:var(--accent);width:0;transition:width 0.3s;
  box-shadow:0 0 10px var(--accent)}

#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:150;padding:12px 24px;background:var(--card);border:1px solid var(--danger);
  color:var(--danger);font-size:14px;opacity:0;transition:all 0.3s;pointer-events:none;
  backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-content{max-width:540px;padding:40px;text-align:center;background:var(--card);
  border:1px solid var(--border);position:relative}
.modal-content::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.modal-title{font-family:'Cinzel',serif;font-size:36px;font-weight:900;margin-bottom:8px;
  letter-spacing:4px}
.modal-title.win{color:var(--accent2);text-shadow:0 0 30px rgba(29,233,182,0.5)}
.modal-title.lose{color:var(--danger);text-shadow:0 0 30px rgba(255,61,0,0.5)}
.modal-sub{font-size:14px;color:var(--muted);margin-bottom:20px;letter-spacing:2px}
.modal-text{font-size:15px;line-height:1.7;color:#c8c0b0;margin-bottom:24px}
.modal-stats{display:flex;justify-content:center;gap:24px;margin-bottom:24px}
.modal-stat{text-align:center}
.modal-stat-val{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--accent)}
.modal-stat-lbl{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}

#story-modal .modal-content{max-width:680px;text-align:left}
.story-chapter{font-family:'Cinzel',serif;font-size:14px;color:var(--accent2);
  letter-spacing:6px;margin-bottom:8px}
.story-title{font-family:'Cinzel',serif;font-size:32px;font-weight:700;margin-bottom:20px;
  color:var(--accent);letter-spacing:3px}
.story-body{font-size:15px;line-height:1.9;color:#d8d0c0;margin-bottom:24px}
.story-body p{margin-bottom:12px}

#range-overlay{position:fixed;inset:0;z-index:10;pointer-events:none}

@media (max-width:768px){
  .tower-bar{padding:8px;gap:6px}
  .tower-btn{width:60px;height:78px}
  #tower-panel{width:200px;right:10px}
  h1{font-size:48px;letter-spacing:4px}
  .level-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-height:50vh}
  .level-card{padding:14px;min-height:140px}
  .level-name{font-size:16px}
}
</style>
</head>
<body>

<div id="canvas-container"></div>
<canvas id="range-overlay"></canvas>

<div id="loading">
  <div class="loading-text">SUMMONING THE RIFT</div>
  <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
</div>

<div id="main-menu" class="overlay">
  <div class="menu-content">
    <div class="title-block">
      <h1>裂痕守护者</h1>
      <div class="subtitle">RIFT GUARDIAN</div>
    </div>
    <div class="story">
      <p>远古之时，世界由四块元素水晶维系平衡——翡翠、烈焰、寒冰、雷霆。</p>
      <p>但虚无之主撕开了时空的裂隙，扭曲生物正从裂缝中涌出，吞噬一切光明。</p>
      <p>你是最后的守护者。在裂痕之处建造防御之塔，绝不让黑暗触及世界之心。</p>
      <p>——守护者，时光将铭记你的名字。</p>
    </div>
    <div class="btn-row">
      <button class="btn" id="start-btn"><span>开始守护</span></button>
    </div>
  </div>
</div>

<div id="level-select" class="overlay hidden">
  <div class="menu-content">
    <div class="title-block">
      <h1 style="font-size:48px">选择战场</h1>
      <div class="subtitle">CHOOSE YOUR BATTLEFIELD</div>
    </div>
    <div class="level-grid" id="level-grid"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="back-to-menu"><span>返回</span></button>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-stat">
      <span class="stat-icon"><svg viewBox="0 0 24 24" fill="#ffd54f"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg></span>
      <span id="gold-val">200</span>
    </div>
    <div class="hud-stat">
      <span class="stat-icon"><svg viewBox="0 0 24 24" fill="#ff3d00"><path d="M12 21s-7-4.5-9.5-9C0 7 4 3 7 3c2 0 4 1 5 3 1-2 3-3 5-3 3 0 7 4 4.5 9C19 16.5 12 21 12 21z"/></svg></span>
      <span id="lives-val">20</span>
    </div>
    <div class="hud-stat">
      <span class="stat-icon"><svg viewBox="0 0 24 24" fill="#1de9b6"><path d="M12 2L3 7v6c0 5 4 9 9 10 5-1 9-5 9-10V7l-9-5z"/></svg></span>
      <span id="wave-val">0/10</span>
    </div>
  </div>
  <div class="hud-right">
    <button class="hud-btn" id="speed-btn" title="加速"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v14l8-7L4 5zm8 0v14l8-7-8-7z"/></svg></button>
    <button class="hud-btn" id="pause-btn" title="暂停"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
    <button class="hud-btn" id="quit-btn" title="退出"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
  </div>
  <div id="wave-control">
    <div class="wave-info" id="wave-info-text">准备就绪</div>
    <button class="start-wave-btn" id="start-wave-btn">下一波次</button>
  </div>
  <div class="tower-bar" id="tower-bar"></div>
  <div id="tower-panel">
    <div class="tp-header">
      <div><div class="tp-name" id="tp-name">箭塔</div><div class="tp-level" id="tp-level">LV.1</div></div>
      <div class="tp-close" id="tp-close"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></div>
    </div>
    <div class="tp-stats">
      <div class="tp-stat"><span>伤害</span><span class="tp-stat-val" id="tp-damage">15</span></div>
      <div class="tp-stat"><span>射程</span><span class="tp-stat-val" id="tp-range">8.0</span></div>
      <div class="tp-stat"><span>射速</span><span class="tp-stat-val" id="tp-rate">1.0</span></div>
    </div>
    <div class="tp-upgrade" id="tp-upgrade-info">升级费用: 50</div>
    <div class="tp-actions">
      <button class="tp-btn" id="tp-upgrade-btn">升级</button>
      <button class="tp-btn sell" id="tp-sell-btn">出售</button>
    </div>
  </div>
</div>

<div id="story-modal" class="overlay hidden">
  <div class="modal-content">
    <div class="story-chapter" id="story-chapter">CHAPTER I</div>
    <div class="story-title" id="story-title">异变的前兆</div>
    <div class="story-body" id="story-body"></div>
    <div class="btn-row"><button class="btn" id="story-continue"><span>开始战斗</span></button></div>
  </div>
</div>

<div id="result-modal" class="overlay hidden">
  <div class="modal-content">
    <div class="modal-title" id="result-title">胜利</div>
    <div class="modal-sub" id="result-sub">VICTORY</div>
    <div class="modal-text" id="result-text"></div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="modal-stat-val" id="result-kills">0</div><div class="modal-stat-lbl">击杀</div></div>
      <div class="modal-stat"><div class="modal-stat-val" id="result-gold">0</div><div class="modal-stat-lbl">金币</div></div>
      <div class="modal-stat"><div class="modal-stat-val" id="result-waves">0</div><div class="modal-stat-lbl">波次</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="result-menu"><span>主菜单</span></button>
      <button class="btn" id="result-next"><span>继续</span></button>
    </div>
  </div>
</div>

<div id="pause-modal" class="overlay hidden">
  <div class="modal-content">
    <div class="modal-title" style="color:var(--accent2)">已暂停</div>
    <div class="modal-sub">PAUSED</div>
    <div class="btn-row" style="margin-top:20px"><button class="btn" id="resume-btn"><span>继续</span></button></div>
    <div class="btn-row"><button class="btn btn-secondary" id="pause-menu-btn"><span>主菜单</span></button></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import * as THREE from 'three';

// ==================== 配置数据 ====================
const TOWER_TYPES = {
  arrow:{name:'箭塔',cost:50,color:0x8b5a2b,accent:0xffa726,range:8,damage:15,fireRate:1.2,projSpeed:30,desc:'单体远程攻击',upgrades:[{cost:60,damage:28,range:9,fireRate:1.4},{cost:120,damage:50,range:10,fireRate:1.6}]},

      for(const side of[1,-1]){for(const dist of[3,5]){const spot=new THREE.Vector3(p.x+perp.x*dist*side,0,p.z+perp.z*dist*side);let tooClose=false;for(const ex of positions){if(ex.distanceTo(spot)<2.5){tooClose=true;break;}}let onPath=false;for(let j=0;j<path.length-1;j++){if(pointToLineDistance(spot,path[j],path[j+1])<2){onPath=true;break;}}if(Math.abs(spot.x)>30||Math.abs(spot.z)>25)tooClose=true;if(!tooClose&&!onPath){positions.push(spot);}}}

function placeTower(spot,type){

function upgradeTower(tower){
  if(tower.level>=3)return false;const upCost=tower.cfg.upgrades[tower.level-1].cost;if(G.gold<upCost){showToast('金币不足');return false;}
  G.gold-=upCost;tower.level++;const up=tower.cfg.upgrades[tower.level-2];tower.damage=up.damage;tower.range=up.range;tower.fireRate=up.fireRate;

}
function sellTower(tower){
  let refund=Math.floor(tower.cfg.cost*0.6);for(let i=0;i<tower.cfg.upgrades.length;i++){if(i<tower.level-1)refund+=Math.floor(tower.cfg.upgrades[i].cost*0.6);}

function spawnEnemy(type){
  const cfg=ENEMY_TYPES[type];const mesh=createEnemyMesh(type);const path=G.level.path;mesh.position.copy(path[0]);mesh.position.y=cfg.flying?0:0;if(cfg.flying)mesh.position.y=0;G.scene.add(mesh);
  const enemy={type,cfg,mesh,hp:cfg.hp,maxHp:cfg.hp,speed:cfg.speed,pathIdx:0,slowEffect:0,slowAmount:1,dotEffect:0,dotDamage:0,flying:cfg.flying,dead:false,reached:false,bobOffset:Math.random()*Math.PI*2,walkPhase:0};
  const hbBg=new THREE.Mesh(new THREE.PlaneGeometry(1,0.12),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.6}));hbBg.position.y=cfg.size+0.6;if(cfg.boss)hbBg.position.y=3;mesh.add(hbBg);
  const hbFg=new THREE.Mesh(new THREE.PlaneGeometry(0.95,0.08),new THREE.MeshBasicMaterial({color:0xff3d00}));hbFg.position.z=0.01;hbFg.position.y=hbBg.position.y;
  mesh.remove(hbBg);enemy.hbBg=hbBg;enemy.hbFg=hbFg;enemy.hbBgWidth=cfg.boss?3:(cfg.size>1?2.2:1);hbBg.scale.x=enemy.hbBgWidth;hbFg.scale.x=enemy.hbBgWidth*0.95;
  G.scene.add(hbBg);G.scene.add(hbFg);G.enemies.push(enemy);
}
function updateEnemy(enemy,dt){
  if(enemy.dead||enemy.reached)return;
  if(enemy.dotEffect>0){enemy.hp-=enemy.dotDamage*dt;enemy.dotEffect-=dt;if(Math.random()<0.3){createParticle(enemy.mesh.position.clone().add(new THREE.Vector3(0,1,0)),0x76ff03,0.2,1);}}
  let speedMul=1;if(enemy.slowEffect>0){enemy.slowEffect-=dt;speedMul=enemy.slowAmount;}else{enemy.slowAmount=1;}
  const path=G.level.path;
  if(enemy.pathIdx<path.length-1){
    const target=path[enemy.pathIdx+1];const pos=enemy.mesh.position;const dir=new THREE.Vector3().subVectors(target,pos);dir.y=0;const dist=dir.length();const moveDist=enemy.speed*speedMul*dt;
    if(dist<moveDist){pos.copy(target);enemy.pathIdx++;}else{dir.normalize();pos.add(dir.multiplyScalar(moveDist));}
    if(dir.length()>0){const targetRot=Math.atan2(dir.x,dir.z);enemy.mesh.rotation.y=lerp(enemy.mesh.rotation.y,targetRot,0.15);}
  }else{enemy.reached=true;G.lives-=enemy.cfg.damage;spawnReachEffect(enemy.mesh.position);removeEnemy(enemy);updateHUD();if(G.lives<=0){gameOver(false);}return;}
  if(enemy.hp<=0){enemy.dead=true;G.gold+=enemy.cfg.gold;G.kills++;spawnDeathEffect(enemy.mesh.position,enemy.cfg.color,enemy.cfg.size);removeEnemy(enemy);updateHUD();return;}
  enemy.walkPhase+=dt*enemy.speed*3*speedMul;
  if(enemy.type==='grunt'||enemy.type==='tank'||enemy.type==='elite'){enemy.mesh.position.y=Math.abs(Math.sin(enemy.walkPhase))*0.15;}
  else if(enemy.type==='runner'){enemy.mesh.position.y=Math.abs(Math.sin(enemy.walkPhase))*0.2;}
  else if(enemy.type==='flyer'){enemy.mesh.position.y=1.5+Math.sin(enemy.bobOffset+G.clock.elapsedTime*2)*0.2;if(enemy.mesh.userData.wings){const flap=Math.sin(G.clock.elapsedTime*15)*0.5;enemy.mesh.userData.wings[0].rotation.z=-0.3+flap;enemy.mesh.userData.wings[1].rotation.z=0.3-flap;}}
  else if(enemy.type==='wraith'){enemy.mesh.position.y=1.5+Math.sin(enemy.bobOffset+G.clock.elapsedTime*3)*0.3;if(enemy.mesh.userData.ring){enemy.mesh.userData.ring.rotation.z+=dt*2;}if(enemy.mesh.userData.body){enemy.mesh.userData.body.rotation.y+=dt*2;}}
  else if(enemy.type==='boss'){enemy.mesh.position.y=1.5+Math.sin(enemy.bobOffset+G.clock.elapsedTime)*0.1;if(enemy.mesh.userData.ring){enemy.mesh.userData.ring.rotation.z+=dt;}if(enemy.mesh.userData.body){enemy.mesh.userData.body.rotation.y+=dt*0.5;}}
  else if(enemy.type==='titan'){enemy.mesh.position.y=Math.abs(Math.sin(enemy.walkPhase*0.5))*0.08;}
  const screenPos=enemy.mesh.position.clone();screenPos.y+=enemy.cfg.boss?3:(enemy.cfg.size>1?2.2:(enemy.cfg.size+0.6));
  if(enemy.hbBg&&enemy.hbFg){enemy.hbBg.position.copy(screenPos);enemy.hbFg.position.copy(screenPos);enemy.hbFg.position.z=screenPos.z+0.01;const ratio=clamp(enemy.hp/enemy.maxHp,0,1);enemy.hbFg.scale.x=enemy.hbBgWidth*0.95*ratio;enemy.hbFg.position.x=screenPos.x-enemy.hbBgWidth*0.95*(1-ratio)*0.5;enemy.hbBg.lookAt(G.camera.position);enemy.hbFg.lookAt(G.camera.position);const visible=enemy.hp<enemy.maxHp;enemy.hbBg.visible=visible;enemy.hbFg.visible=visible;}
}
function worldToScreen(pos){const v=pos.clone().project(G.camera);return new THREE.Vector3((v.x+1)/2*window.innerWidth,(1-(v.y+1)/2)*window.innerHeight,0);}
function removeEnemy(enemy){G.scene.remove(enemy.mesh);if(enemy.hbBg)G.scene.remove(enemy.hbBg);if(enemy.hbFg)G.scene.remove(enemy.hbFg);const idx=G.enemies.indexOf(enemy);if(idx>=0)G.enemies.splice(idx,1);}

// ==================== 塔攻击 ====================
function updateTower(tower,dt){
  tower.cooldown-=dt;tower.glowTime-=dt;
  const enemies=G.enemies.filter(e=>!e.dead&&!e.reached);let target=null;let minDistToEnd=Infinity;
  for(const e of enemies){const d=e.mesh.position.distanceTo(tower.mesh.position);if(d<=tower.range){const distToEnd=G.level.path.length-1-e.pathIdx;if(distToEnd<minDistToEnd){minDistToEnd=distToEnd;target=e;}}}
  tower.target=target;
  if(target&&tower.mesh.userData.head){const dir=new THREE.Vector3().subVectors(target.mesh.position,tower.mesh.position);dir.y=0;const targetRot=Math.atan2(dir.x,dir.z);const head=tower.mesh.userData.head;let diff=targetRot-head.rotation.y;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;head.rotation.y+=diff*0.15;}
  if(tower.type==='laser'&&target){target.hp-=tower.damage*dt;tower.glowTime=0.1;if(!tower.laserBeam){const geo=new THREE.CylinderGeometry(0.08,0.08,1,6);const mat=new THREE.MeshBasicMaterial({color:tower.cfg.accent,transparent:true,opacity:0.8});tower.laserBeam=new THREE.Mesh(geo,mat);G.scene.add(tower.laserBeam);}
    const start=tower.mesh.position.clone();start.y=1.8;const end=target.mesh.position.clone();end.y+=0.5;const mid=new THREE.Vector3().lerpVectors(start,end,0.5);tower.laserBeam.position.copy(mid);tower.laserBeam.lookAt(end);tower.laserBeam.rotateX(Math.PI/2);tower.laserBeam.scale.y=start.distanceTo(end);tower.laserBeam.visible=true;
    if(tower.mesh.userData.lens){tower.mesh.userData.lens.material.emissiveIntensity=2;}if(Math.random()<0.4){createParticle(end,tower.cfg.accent,0.15,0.6);}
  }else{if(tower.laserBeam){tower.laserBeam.visible=false;}if(tower.mesh.userData.lens){tower.mesh.userData.lens.material.emissiveIntensity=1.2;}}
  if(tower.type==='lightning'&&target&&tower.cooldown<=0){tower.cooldown=1/tower.fireRate;tower.glowTime=0.2;const chainTargets=[target];let current=target;for(let i=1;i<tower.chains;i++){let nextTarget=null;let minD=tower.cfg.chainRange||4;for(const e of enemies){if(chainTargets.includes(e))continue;const d=e.mesh.position.distanceTo(current.mesh.position);if(d<minD){minD=d;nextTarget=e;}}if(nextTarget){chainTargets.push(nextTarget);current=nextTarget;}else break;}
    let from=tower.mesh.position.clone();from.y=1.8;for(const t of chainTargets){t.hp-=tower.damage*(1-chainTargets.indexOf(t)*0.15);const to=t.mesh.position.clone();to.y+=0.5;createLightning(from,to,tower.cfg.accent);from=to;}
    if(tower.mesh.userData.orb){tower.mesh.userData.orb.material.emissiveIntensity=3;setTimeout(()=>{if(tower.mesh.userData.orb)tower.mesh.userData.orb.material.emissiveIntensity=1.5;},100);}}
  if(['arrow','cannon','frost','poison'].includes(tower.type)&&target&&tower.cooldown<=0){tower.cooldown=1/tower.fireRate;tower.glowTime=0.15;fireProjectile(tower,target);}
  if(tower.type==='poison'&&Math.random()<0.3){const p=createParticle(tower.mesh.position.clone().add(new THREE.Vector3(0,1.8,0)),tower.cfg.accent,0.2,1.5);p.velocity.y=0.5;}
}
function fireProjectile(tower,target){
  const cfg=tower.cfg;const start=tower.mesh.position.clone();start.y=1.8;let projMesh;
  if(tower.type==='arrow'){projMesh=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.5,4),new THREE.MeshBasicMaterial({color:cfg.accent}));}
  else if(tower.type==='cannon'){projMesh=new THREE.Mesh(new THREE.SphereGeometry(0.2,6,6),new THREE.MeshStandardMaterial({color:0x2a2a2a,emissive:cfg.accent,emissiveIntensity:0.5}));}
  else if(tower.type==='frost'){projMesh=new THREE.Mesh(new THREE.OctahedronGeometry(0.18,0),new THREE.MeshStandardMaterial({color:cfg.accent,emissive:cfg.accent,emissiveIntensity:1}));}
  else if(tower.type==='poison'){projMesh=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,4),new THREE.MeshStandardMaterial({color:cfg.accent,emissive:cfg.accent,emissiveIntensity:0.6}));}
  projMesh.position.copy(start);G.scene.add(projMesh);const proj={mesh:projMesh,target,tower,speed:cfg.projSpeed||20,type:tower.type,trail:true};G.projectiles.push(proj);
}
function updateProjectile(proj,dt){
  if(!proj.target||proj.target.dead||proj.target.reached){if(proj.mesh)G.scene.remove(proj.mesh);const idx=G.projectiles.indexOf(proj);if(idx>=0)G.projectiles.splice(idx,1);return;}
  const targetPos=proj.target.mesh.position.clone();targetPos.y+=0.5;const dir=new THREE.Vector3().subVectors(targetPos,proj.mesh.position);const dist=dir.length();const moveDist=proj.speed*dt;
  if(dist<moveDist+0.3){onProjectileHit(proj);G.scene.remove(proj.mesh);const idx=G.projectiles.indexOf(proj);if(idx>=0)G.projectiles.splice(idx,1);}
  else{dir.normalize();proj.mesh.position.add(dir.multiplyScalar(moveDist));proj.mesh.lookAt(targetPos);if(Math.random()<0.5){createParticle(proj.mesh.position.clone(),proj.tower.cfg.accent,0.1,0.4);}}
}
function onProjectileHit(proj){
  const tower=proj.tower;const target=proj.target;const cfg=tower.cfg;
  if(tower.type==='arrow'){target.hp-=tower.damage;spawnHitEffect(target.mesh.position.clone().add(new THREE.Vector3(0,0.5,0)),cfg.accent);}
  else if(tower.type==='cannon'){target.hp-=tower.damage;spawnExplosion(target.mesh.position.clone(),cfg.accent,tower.aoe||2.5);for(const e of G.enemies){if(e===target||e.dead||e.reached)continue;const d=e.mesh.position.distanceTo(target.mesh.position);if(d<(tower.aoe||2.5)){e.hp-=tower.damage*0.6;}}}
  else if(tower.type==='frost'){target.hp-=tower.damage;target.slowEffect=cfg.slowDur||2;target.slowAmount=1-(tower.slow||0.5);spawnFrostEffect(target.mesh.position.clone().add(new THREE.Vector3(0,0.5,0)));}
  else if(tower.type==='poison'){target.hp-=tower.damage;target.dotEffect=cfg.dotDur||4;target.dotDamage=tower.dot||cfg.dot;spawnPoisonEffect(target.mesh.position.clone().add(new THREE.Vector3(0,0.5,0)));}
}

// ==================== 特效 ====================
function createParticle(pos,color,size=0.15,lifetime=1){const geo=new THREE.SphereGeometry(size,4,4);const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1});const p=new THREE.Mesh(geo,mat);p.position.copy(pos);G.scene.add(p);const particle={mesh:p,life:lifetime,maxLife:lifetime,velocity:new THREE.Vector3((Math.random()-0.5)*2,Math.random()*2,(Math.random()-0.5)*2),color};G.particles.push(particle);return particle;}
function updateParticle(p,dt){p.life-=dt;if(p.life<=0){G.scene.remove(p.mesh);const idx=G.particles.indexOf(p);if(idx>=0)G.particles.splice(idx,1);return;}if(p.orbit&&p.target){p.angle+=p.speed*dt;p.mesh.position.x=p.target.x+Math.cos(p.angle)*p.radius;p.mesh.position.z=p.target.z+Math.sin(p.angle)*p.radius;p.mesh.position.y=p.target.y+Math.sin(p.angle*2)*0.5;}else{p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));p.velocity.y-=3*dt;}const ratio=p.life/p.maxLife;p.mesh.material.opacity=ratio;p.mesh.scale.setScalar(ratio);}
function createLightning(from,to,color){const segments=8;const points=[];for(let i=0;i<=segments;i++){const t=i/segments;const p=new THREE.Vector3().lerpVectors(from,to,t);if(i>0&&i<segments){p.x+=(Math.random()-0.5)*0.5;p.y+=(Math.random()-0.5)*0.5;p.z+=(Math.random()-0.5)*0.5;}points.push(p);}const geo=new THREE.BufferGeometry().setFromPoints(points);const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:0.9});const line=new THREE.Line(geo,mat);G.scene.add(line);G.effects.push({mesh:line,type:'lightning',life:0.2,maxLife:0.2});for(let i=0;i<5;i++){const t=Math.random();const p=new THREE.Vector3().lerpVectors(from,to,t);createParticle(p,color,0.15,0.3);}}
function spawnHitEffect(pos,color){for(let i=0;i<8;i++){createParticle(pos,color,0.15,0.5);}}
function spawnExplosion(pos,color,radius){const flashGeo=new THREE.SphereGeometry(radius*0.3,8,8);const flashMat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.9});const flash=new THREE.Mesh(flashGeo,flashMat);flash.position.copy(pos);G.scene.add(flash);G.effects.push({mesh:flash,type:'expand',life:0.3,maxLife:0.3,targetScale:radius*2});for(let i=0;i<20;i++){const p=createParticle(pos,color,0.2,0.7);p.velocity.multiplyScalar(2);}
  const ringGeo=new THREE.RingGeometry(0.1,0.3,16);const ringMat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.7,side:THREE.DoubleSide});const ring=new THREE.Mesh(ringGeo,ringMat);ring.position.copy(pos);ring.rotation.x=-Math.PI/2;G.scene.add(ring);G.effects.push({mesh:ring,type:'shockwave',life:0.5,maxLife:0.5,targetScale:radius*3});}
function spawnFrostEffect(pos){for(let i=0;i<10;i++){const p=createParticle(pos,0xb3e5fc,0.18,0.6);p.velocity.multiplyScalar(0.8);}const ringGeo=new THREE.RingGeometry(0.1,0.25,12);const ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0x4fc3f7,transparent:true,opacity:0.8,side:THREE.DoubleSide}));ring.position.copy(pos);ring.rotation.x=-Math.PI/2;G.scene.add(ring);G.effects.push({mesh:ring,type:'shockwave',life:0.4,maxLife:0.4,targetScale:2});}
function spawnPoisonEffect(pos){for(let i=0;i<6;i++){const p=createParticle(pos,0x76ff03,0.2,0.8);p.velocity.y=0.5+Math.random();p.velocity.x*=0.3;p.velocity.z*=0.3;}}
function spawnDeathEffect(pos,color,size){for(let i=0;i<15;i++){const p=createParticle(pos.clone().add(new THREE.Vector3(0,0.5,0)),color,0.2,0.8);p.velocity.multiplyScalar(1.5);}for(let i=0;i<5;i++){const p=createParticle(pos.clone().add(new THREE.Vector3(0,1,0)),0xffd54f,0.15,0.6);p.velocity.y=2;}}
function spawnBuildEffect(pos){for(let i=0;i<12;i++){const p=createParticle(pos.clone().add(new THREE.Vector3(0,0.5,0)),0xffa726,0.15,0.6);p.velocity.y=2+Math.random();}}
function spawnReachEffect(pos){for(let i=0;i<10;i++){const p=createParticle(pos,0xff3d00,0.2,0.5);p.velocity.multiplyScalar(2);}}
function updateEffect(eff,dt){
  if(eff.type==='lightning'){eff.life-=dt;if(eff.life<=0){G.scene.remove(eff.mesh);const idx=G.effects.indexOf(eff);if(idx>=0)G.effects.splice(idx,1);return;}eff.mesh.material.opacity=eff.life/eff.maxLife;}
  else if(eff.type==='expand'){eff.life-=dt;if(eff.life<=0){G.scene.remove(eff.mesh);const idx=G.effects.indexOf(eff);if(idx>=0)G.effects.splice(idx,1);return;}const ratio=1-eff.life/eff.maxLife;eff.mesh.scale.setScalar(lerp(0.5,eff.targetScale,ratio));eff.mesh.material.opacity=(1-ratio)*0.9;}
  else if(eff.type==='shockwave'){eff.life-=dt;if(eff.life<=0){G.scene.remove(eff.mesh);const idx=G.effects.indexOf(eff);if(idx>=0)G.effects.splice(idx,1);return;}const ratio=1-eff.life/eff.maxLife;eff.mesh.scale.setScalar(lerp(0.3,eff.targetScale,ratio));eff.mesh.material.opacity=(1-ratio)*0.8;}
  else if(eff.type==='rotate'){eff.mesh.rotation.y+=dt*(eff.speed||1);}
  else if(eff.type==='bob'){eff.mesh.position.y=(eff.baseY||0)+Math.sin(G.clock.elapsedTime*(eff.speed||1)+(eff.offset||0))*(eff.amp||0.2);}
}

// ==================== 波次 ====================
function startWave(){if(G.waveInProgress)return;if(G.wave>=G.level.waves.length)return;G.wave++;G.waveInProgress=true;const waveDef=G.level.waves[G.wave-1];G.spawnQueue=[];for(const group of waveDef){for(let i=0;i<group.count;i++){G.spawnQueue.push({type:group.type,delay:group.delay});}}G.spawnTimer=0;document.getElementById('start-wave-btn').disabled=true;document.getElementById('wave-info-text').textContent=`第 ${G.wave} 波`;updateHUD();}
function updateWave(dt){if(!G.waveInProgress)return;if(G.spawnQueue.length>0){G.spawnTimer-=dt;if(G.spawnTimer<=0){const next=G.spawnQueue.shift();spawnEnemy(next.type);G.spawnTimer=next.delay;}}else if(G.enemies.length===0){G.waveInProgress=false;G.gold+=30+G.wave*5;updateHUD();if(G.wave>=G.level.waves.length){setTimeout(()=>gameOver(true),1000);}else{document.getElementById('start-wave-btn').disabled=false;document.getElementById('wave-info-text').textContent=`波次完成 +${30+G.wave*5}金币`;}}}

// ==================== HUD ====================
function updateHUD(){
  document.getElementById('gold-val').textContent=G.gold;
  document.getElementById('lives-val').textContent=Math.max(0,G.lives);
  document.getElementById('wave-val').textContent=`${G.wave}/${G.level.waves.length}`;

  // 🔧 修复：所有塔按钮（包括选中的）都根据实际成本判断是否可负担
  document.querySelectorAll('.tower-btn').forEach(btn=>{
    const type = btn.dataset.type;
    const cost = TOWER_TYPES[type].cost;
    const canAfford = G.gold >= cost;
    btn.classList.toggle('unaffordable', !canAfford);
  });

  // 如果选中的塔类型金币不足，自动取消选择
  if(G.selectedTowerType && G.gold < TOWER_TYPES[G.selectedTowerType].cost){
    cancelGhost();
  }

  // 塔信息面板
  if(G.selectedTower){
    const t=G.selectedTower;
    document.getElementById('tp-name').textContent=t.cfg.name;
    document.getElementById('tp-level').textContent=`LV.${t.level}`;
    document.getElementById('tp-damage').textContent=t.damage.toFixed(t.type==='laser'?1:0);
    document.getElementById('tp-range').textContent=t.range.toFixed(1);
    document.getElementById('tp-rate').textContent=t.fireRate.toFixed(1);
    if(t.level<3){
      const upCost=t.cfg.upgrades[t.level-1].cost;
      document.getElementById('tp-upgrade-info').textContent=`升级费用: ${upCost}`;
      document.getElementById('tp-upgrade-btn').disabled=G.gold<upCost;
      document.getElementById('tp-upgrade-btn').textContent='升级';
    }else{
      document.getElementById('tp-upgrade-info').textContent='已达最高等级';
      document.getElementById('tp-upgrade-btn').disabled=true;
      document.getElementById('tp-upgrade-btn').textContent='满级';
    }
    let refund=Math.floor(t.cfg.cost*0.6);
    for(let i=0;i<t.level-1;i++)refund+=Math.floor(t.cfg.upgrades[i].cost*0.6);
    document.getElementById('tp-sell-btn').textContent=`出售 (+${refund})`;
  }
}
function buildTowerBar(){
  const bar=document.getElementById('tower-bar');bar.innerHTML='';

  // 🔧 修复：使用 cfg.color（更深的颜色）作为图标颜色，确保冰塔等浅色塔也能看清
  const icons={
    arrow:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11l18-8-8 18-2-7-8-3z"/></svg>',
    cannon:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><rect x="11" y="2" width="2" height="10"/></svg>',
    frost:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    lightning:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-2 8 9-12h-7l2-8z"/></svg>',
    poison:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8 6 6 10 6 14a6 6 0 0012 0c0-4-2-8-6-12z"/></svg>',
    laser:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
  };

  for(const[type,cfg]of Object.entries(TOWER_TYPES)){
    const btn=document.createElement('div');
    btn.className='tower-btn';
    btn.dataset.type=type;
    // 使用 cfg.color 作为图标颜色（更深更饱和，在深色背景上更明显）
    const iconColor = '#' + cfg.color.toString(16).padStart(6, '0');
    btn.innerHTML=`
      <div class="tower-icon" style="color:${iconColor}">${icons[type]}</div>
      <div class="tower-name">${cfg.name}</div>
      <div class="tower-cost">⬡ ${cfg.cost}</div>
    `;
    btn.title=cfg.desc;
    btn.addEventListener('click',()=>{
      if(G.gold<cfg.cost){
        showToast('金币不足');
        return;
      }
      // 如果已经选中同类型，取消选择
      if(G.selectedTowerType===type){
        G.selectedTowerType=null;
        cancelGhost();
        document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));
        return;
      }
      // 选择新类型
      document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));
      G.selectedTowerType=type;
      btn.classList.add('selected');
      createGhost(type);
    });
    bar.appendChild(btn);
  }
}
function createGhost(type){if(G.ghostTower)G.scene.remove(G.ghostTower);G.ghostTower=createTowerMesh(type);G.ghostTower.traverse(c=>{if(c.material){c.material=c.material.clone();c.material.transparent=true;c.material.opacity=0.5;}});G.scene.add(G.ghostTower);}
function cancelGhost(){if(G.ghostTower){G.scene.remove(G.ghostTower);G.ghostTower=null;}G.selectedTowerType=null;document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));}

// ==================== 范围指示器 ====================
function drawRangeIndicator(){
  const ctx=G.rangeCtx;ctx.clearRect(0,0,G.rangeCanvas.width,G.rangeCanvas.height);
  let drawRange=null,drawPos=null,drawColor='#ffa726';
  if(G.hoveredSpot&&G.selectedTowerType&&!G.hoveredSpot.occupied){drawRange=TOWER_TYPES[G.selectedTowerType].range;drawPos=G.hoveredSpot.position;drawColor='#1de9b6';}
  if(G.selectedTower){drawRange=G.selectedTower.range;drawPos=G.selectedTower.mesh.position;drawColor='#ffa726';}
  if(drawRange&&drawPos){const center=drawPos.clone();center.y=0.1;const segments=48;ctx.beginPath();for(let i=0;i<=segments;i++){const angle=(i/segments)*Math.PI*2;const p=new THREE.Vector3(center.x+Math.cos(angle)*drawRange,0.1,center.z+Math.sin(angle)*drawRange);const screen=worldToScreen(p);if(i===0)ctx.moveTo(screen.x,screen.y);else ctx.lineTo(screen.x,screen.y);}ctx.strokeStyle=drawColor;ctx.lineWidth=2;ctx.globalAlpha=0.8;ctx.stroke();ctx.fillStyle=drawColor;ctx.globalAlpha=0.08;ctx.fill();ctx.globalAlpha=1;}
}

// ==================== 鼠标交互 ====================
function initInput(){G.renderer.domElement.addEventListener('mousemove',onMouseMove);G.renderer.domElement.addEventListener('click',onClick);G.renderer.domElement.addEventListener('contextmenu',e=>{e.preventDefault();cancelGhost();if(G.selectedTower){G.selectedTower=null;document.getElementById('tower-panel').classList.remove('show');}});}
function onMouseMove(e){G.mouse.x=(e.clientX/window.innerWidth)*2-1;G.mouse.y=-(e.clientY/window.innerHeight)*2+1;if(G.selectedTowerType&&G.ghostTower){G.raycaster.setFromCamera(G.mouse,G.camera);const spotMeshes=G.buildSpots.filter(s=>!s.occupied).map(s=>s.mesh);const intersects=G.raycaster.intersectObjects(spotMeshes);if(intersects.length>0){const spot=G.buildSpots.find(s=>s.mesh===intersects[0].object);G.hoveredSpot=spot;G.ghostTower.position.copy(spot.position);G.ghostTower.visible=true;}else{G.hoveredSpot=null;G.ghostTower.visible=false;}}else{G.hoveredSpot=null;}}
function onClick(e){if(G.state!=='playing')return;if(G.selectedTowerType&&G.hoveredSpot){placeTower(G.hoveredSpot,G.selectedTowerType);return;}
  G.raycaster.setFromCamera(G.mouse,G.camera);const towerMeshes=G.towers.map(t=>t.mesh);const intersects=G.raycaster.intersectObjects(towerMeshes,true);if(intersects.length>0){let target=intersects[0].object;while(target.parent&&!G.towers.find(t=>t.mesh===target)){target=target.parent;}const tower=G.towers.find(t=>t.mesh===target);if(tower){selectTower(tower);return;}}if(G.selectedTower){G.selectedTower=null;document.getElementById('tower-panel').classList.remove('show');}}
function selectTower(tower){G.selectedTower=tower;document.getElementById('tower-panel').classList.add('show');updateHUD();}

// ==================== 游戏循环 ====================
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(G.clock.getDelta(),0.1)*G.gameSpeed;
  if(G.state==='playing'&&!G.paused){
    updateWave(dt);
    for(const enemy of[...G.enemies])updateEnemy(enemy,dt);
    for(const tower of G.towers)updateTower(tower,dt);
    for(const proj of[...G.projectiles])updateProjectile(proj,dt);
    for(const p of[...G.particles])updateParticle(p,dt);
    for(const eff of[...G.effects])updateEffect(eff,dt);
    for(const spot of G.buildSpots){if(!spot.occupied){spot.mesh.material.opacity=0.3+Math.sin(G.clock.elapsedTime*2)*0.15;spot.mesh.rotation.y+=dt*0.5;}}
    G.camera.position.x=Math.sin(G.clock.elapsedTime*0.1)*0.5;
  }
  drawRangeIndicator();
  G.renderer.render(G.scene,G.camera);
}

// ==================== 游戏控制 ====================
function showStoryModal(){document.getElementById('story-chapter').textContent=G.level.chapter;document.getElementById('story-title').textContent=G.level.chapterTitle;const body=document.getElementById('story-body');body.innerHTML=G.level.story.map(p=>`<p>${p}</p>`).join('');document.getElementById('story-modal').classList.remove('hidden');G.state='story';}
function startGame(){document.getElementById('story-modal').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');G.state='playing';buildTowerBar();document.getElementById('start-wave-btn').disabled=false;document.getElementById('wave-info-text').textContent='准备就绪';}
function gameOver(win){
  G.state=win?'win':'lose';
  if(win&&G.levelIdx+1<LEVELS.length){G.unlockedLevels=Math.max(G.unlockedLevels,G.levelIdx+2);try{localStorage.setItem('rg_unlocked',G.unlockedLevels);}catch(e){}}
  const modal=document.getElementById('result-modal');const title=document.getElementById('result-title');const sub=document.getElementById('result-sub');const text=document.getElementById('result-text');const nextBtn=document.getElementById('result-next');
  if(win){
    title.textContent='胜利';title.className='modal-title win';sub.textContent='VICTORY';
    if(G.levelIdx+1<LEVELS.length){
      text.textContent='裂痕暂时被封锁，但更深处的黑暗正在涌动。前往下一个战场。';
      nextBtn.textContent='下一关';nextBtn.style.display='';
      nextBtn.onclick=()=>{document.getElementById('result-modal').classList.add('hidden');loadLevel(G.levelIdx+1);};
    }else{
      text.textContent='虚无之主已被彻底击退。世界之心水晶再次闪耀——而且比以往任何时候都更加明亮。守护者，你的名字将被铭刻在时光的永恒之中。';
      nextBtn.textContent='返回主菜单';nextBtn.style.display='';
      nextBtn.onclick=()=>{document.getElementById('result-modal').classList.add('hidden');backToMenu();};
    }
  }else{
    title.textContent='失败';title.className='modal-title lose';sub.textContent='DEFEAT';text.textContent='世界之心被虚无吞噬。但守护者不会真正陨落——重整旗鼓，再次出击。';nextBtn.textContent='重试';
    nextBtn.onclick=()=>{document.getElementById('result-modal').classList.add('hidden');loadLevel(G.levelIdx);};
  }
  document.getElementById('result-kills').textContent=G.kills;document.getElementById('result-gold').textContent=G.gold;document.getElementById('result-waves').textContent=G.wave;modal.classList.remove('hidden');
}
function showLevelSelect(){
  document.getElementById('main-menu').classList.add('hidden');document.getElementById('level-select').classList.remove('hidden');
  const grid=document.getElementById('level-grid');grid.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const card=document.createElement('div');const locked=i+1>G.unlockedLevels;card.className='level-card'+(locked?' locked':'');
    card.innerHTML=`<div class="level-preview preview-${i+1}"></div><div class="level-num">CHAPTER ${CHAPTER_ROMAN[i]}</div><div class="level-name">${lv.name}</div><div class="level-sub">${lv.subtitle}</div><div class="level-info">${locked?'🔒 未解锁':`${lv.waves.length} 波次 · 起始 ${lv.startGold} 金币`}</div>`;
    if(!locked){card.addEventListener('click',()=>{document.getElementById('level-select').classList.add('hidden');loadLevel(i);});}
    grid.appendChild(card);
  });
}
function backToMenu(){document.getElementById('level-select').classList.add('hidden');document.getElementById('main-menu').classList.remove('hidden');document.getElementById('hud').classList.add('hidden');document.getElementById('result-modal').classList.add('hidden');document.getElementById('pause-modal').classList.add('hidden');G.state='menu';while(G.scene.children.length>0){const obj=G.scene.children[0];G.scene.remove(obj);}G.towers=[];G.enemies=[];G.projectiles=[];G.particles=[];G.effects=[];}
function togglePause(){if(G.state!=='playing')return;G.paused=!G.paused;document.getElementById('pause-modal').classList.toggle('hidden',!G.paused);}
function toggleSpeed(){G.gameSpeed=G.gameSpeed===1?2:1;const btn=document.getElementById('speed-btn');btn.style.color=G.gameSpeed===2?'var(--accent2)':'';btn.style.borderColor=G.gameSpeed===2?'var(--accent2)':'';}

// ==================== 事件绑定 ====================
document.getElementById('start-btn').addEventListener('click',showLevelSelect);
document.getElementById('back-to-menu').addEventListener('click',backToMenu);
document.getElementById('start-wave-btn').addEventListener('click',startWave);
document.getElementById('speed-btn').addEventListener('click',toggleSpeed);
document.getElementById('pause-btn').addEventListener('click',togglePause);
document.getElementById('quit-btn').addEventListener('click',()=>{if(confirm('确定要退出当前关卡吗？')){backToMenu();}});
document.getElementById('resume-btn').addEventListener('click',togglePause);
document.getElementById('pause-menu-btn').addEventListener('click',backToMenu);
document.getElementById('story-continue').addEventListener('click',startGame);
document.getElementById('result-menu').addEventListener('click',backToMenu);
document.getElementById('tp-close').addEventListener('click',()=>{G.selectedTower=null;document.getElementById('tower-panel').classList.remove('show');});
document.getElementById('tp-upgrade-btn').addEventListener('click',()=>{if(G.selectedTower)upgradeTower(G.selectedTower);});
document.getElementById('tp-sell-btn').addEventListener('click',()=>{if(G.selectedTower)sellTower(G.selectedTower);});

window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(G.selectedTower){G.selectedTower=null;document.getElementById('tower-panel').classList.remove('show');}
    else if(G.selectedTowerType){cancelGhost();}
    else if(G.state==='playing'){togglePause();}
  }else if(e.key===' '){
    e.preventDefault();
    if(G.state==='playing'&&!G.waveInProgress)startWave();
  }else if(e.key>='1'&&e.key<='6'){
    const types=Object.keys(TOWER_TYPES);const idx=parseInt(e.key)-1;
    if(idx<types.length){document.querySelector(`.tower-btn[data-type="${types[idx]}"]`)?.click();}
  }
});

// ==================== 启动 ====================
initScene();initInput();animate();
let loadProgress=0;const loadInterval=setInterval(()=>{loadProgress+=15+Math.random()*15;document.getElementById('loading-fill').style.width=Math.min(100,loadProgress)+'%';if(loadProgress>=100){clearInterval(loadInterval);setTimeout(()=>{document.getElementById('loading').style.opacity='0';setTimeout(()=>document.getElementById('loading').style.display='none',500);},300);}},100);
</script>
