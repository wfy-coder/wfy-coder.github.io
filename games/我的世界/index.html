<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的世界</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; background: #000; }
canvas { display: block; }

#loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; color: #fff;
}
.loading-bar {
    width: 300px; height: 6px; background: rgba(255,255,255,0.1);
    border-radius: 3px; margin-top: 20px; overflow: hidden;
}
.loading-fill {
    height: 100%; background: linear-gradient(90deg, #4CAF50, #81C784);
    border-radius: 3px; transition: width 0.3s; width: 0%;
}
.loading-text { margin-top: 15px; font-size: 14px; color: #aaa; }

#hud {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 100;
}
#crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px;
}
#crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.8);
    box-shadow: 0 0 4px rgba(0,0,0,0.8);
}
#crosshair::before { width: 2px; height: 24px; left: 11px; }
#crosshair::after { width: 24px; height: 2px; top: 11px; }

#hotbar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 6px;
    background: rgba(0,0,0,0.5); border-radius: 8px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.15);
}
.hotbar-slot {
    width: 52px; height: 52px; border-radius: 6px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: all 0.2s;
    cursor: pointer; pointer-events: auto;
}
.hotbar-slot.active {
    border-color: #fff; background: rgba(255,255,255,0.2);
    transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.3);
}
.hotbar-slot canvas { width: 40px; height: 40px; border-radius: 4px; }
.slot-number {
    position: absolute; top: 2px; left: 4px;
    font-size: 10px; color: rgba(255,255,255,0.6);
}

#info-panel {
    position: absolute; top: 15px; left: 15px;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    padding: 12px 18px; border-radius: 10px;
    color: #fff; font-size: 13px; line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.1);
}
#info-panel .label { color: #aaa; }
#info-panel .value { color: #81C784; font-weight: bold; }

#menu {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; flex-direction: column; gap: 15px;
}
#menu.hidden { display: none; }
.menu-title {
    font-size: 48px; font-weight: bold; color: #fff;
    text-shadow: 0 4px 20px rgba(76,175,80,0.5);
    margin-bottom: 20px; letter-spacing: 3px;
}
.menu-btn {
    padding: 14px 50px; font-size: 18px; color: #fff;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    border: none; border-radius: 30px; cursor: pointer;
    transition: all 0.3s; min-width: 250px;
    box-shadow: 0 4px 15px rgba(76,175,80,0.3);
}
.menu-btn:hover {
    transform: translateY(-2px); box-shadow: 0 6px 25px rgba(76,175,80,0.5);
}
.menu-btn.secondary {
    background: linear-gradient(135deg, #455A64, #263238);
    box-shadow: 0 4px 15px rgba(69,90,100,0.3);
}

#inventory {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
    display: none; align-items: center; justify-content: center;
    z-index: 150; flex-direction: column;
}
#inventory.show { display: flex; }
.inventory-title {
    font-size: 28px; color: #fff; margin-bottom: 25px;
    text-shadow: 0 2px 10px rgba(76,175,80,0.5);
}
.inventory-container {
    max-width: 1100px; max-height: 70vh; overflow-y: auto;
    padding: 20px; background: rgba(0,0,0,0.5);
    border-radius: 15px; border: 2px solid rgba(255,255,255,0.1);
}
.inventory-category {
    margin-bottom: 20px;
}
.category-title {
    color: #81C784; font-size: 16px; margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;
}
.inventory-grid {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px;
}
.inventory-slot {
    width: 80px; height: 80px; border-radius: 8px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; position: relative;
}
.inventory-slot:hover {
    border-color: #4CAF50; background: rgba(76,175,80,0.2);
    transform: scale(1.08);
}
.inventory-slot.selected {
    border-color: #fff; background: rgba(255,255,255,0.2);
    box-shadow: 0 0 15px rgba(255,255,255,0.3);
}
.inventory-slot canvas { width: 50px; height: 50px; border-radius: 4px; }
.inventory-slot .block-name {
    font-size: 9px; color: #ccc; margin-top: 2px;
    text-align: center; line-height: 1.1;
    max-width: 75px; word-break: break-all;
}
.inventory-hint {
    color: #aaa; font-size: 13px; margin-top: 20px;
    text-align: center;
}
.inventory-search {
    width: 300px; padding: 10px 15px; margin-bottom: 15px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: #fff; font-size: 14px;
}
.inventory-search::placeholder { color: rgba(255,255,255,0.5); }
.inventory-search:focus { outline: none; border-color: #4CAF50; }

#block-info {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, 40px);
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    padding: 8px 16px; border-radius: 6px;
    color: #fff; font-size: 14px; opacity: 0;
    transition: opacity 0.3s; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.1);
}

#toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
    color: #fff; padding: 12px 24px; border-radius: 8px;
    font-size: 14px; z-index: 300; opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    border: 1px solid rgba(255,255,255,0.1);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }

#underwater-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 40;
    background: rgba(30, 80, 180, 0.4);
    opacity: 0; transition: opacity 0.3s;
    backdrop-filter: blur(2px);
}
#underwater-overlay.active { opacity: 1; }

.vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 50;
    box-shadow: inset 0 0 200px rgba(0,0,0,0.5);
}

.inventory-container::-webkit-scrollbar { width: 8px; }
.inventory-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
.inventory-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
.inventory-container::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
</style>
</head>
<body>

<div id="loading">
    <div style="font-size: 32px; font-weight: bold; color: #fff; text-shadow: 0 4px 20px rgba(76,175,80,0.5);">我的世界</div>
    <div style="color: #aaa; margin-top: 5px;">无限世界 · 200+方块 · 50+生物群系</div>
    <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
    <div class="loading-text" id="loading-text">正在初始化...</div>
</div>

<div id="hud" style="display:none;">
    <div id="crosshair"></div>
    <div id="info-panel">
        <div><span class="label">位置: </span><span class="value" id="pos-info">0, 0, 0</span></div>
        <div><span class="label">方块: </span><span class="value" id="block-info-text">空气</span></div>
        <div><span class="label">生物群系: </span><span class="value" id="biome-info">平原</span></div>
        <div><span class="label">FPS: </span><span class="value" id="fps-info">60</span></div>
        <div><span class="label">区块: </span><span class="value" id="chunk-info">0</span></div>
    </div>
    <div id="hotbar"></div>
    <div id="block-info"></div>
</div>

<div id="underwater-overlay"></div>

<div id="inventory">
    <div class="inventory-title">方块选择 (按E关闭)</div>
    <input type="text" class="inventory-search" id="inventory-search" placeholder="搜索方块名称...">
    <div class="inventory-container" id="inventory-container"></div>
    <div class="inventory-hint">点击方块替换当前快捷栏位置 | 当前选中: 快捷栏第 <span id="current-slot">1</span> 格</div>
</div>

<div id="menu" class="hidden">
    <div class="menu-title">我的世界</div>
    <button class="menu-btn" id="btn-continue">继续游戏</button>
    <button class="menu-btn secondary" id="btn-new">新世界</button>
    <button class="menu-btn secondary" id="btn-save">保存世界</button>
    <div style="color: #aaa; font-size: 13px; margin-top: 20px; text-align: center; line-height: 2;">
        WASD: 移动 | 空格: 跳跃 | 鼠标: 视角<br>
        左键: 破坏方块 | 右键: 放置方块 | 滚轮: 切换方块<br>
        E: 方块选择菜单 | ESC: 系统菜单 | F: 切换飞行模式
    </div>
</div>

<div id="toast"></div>
<div class="vignette"></div>

<script>
// ========== 噪声生成器 ==========
class NoiseGenerator {
    constructor(seed = 12345) {
        this.seed = seed;
        this.perm = new Uint8Array(512);
        this.init();
    }
    init() {
        let p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        let s = this.seed;
        for (let i = 255; i > 0; i--) {
            s = (s * 16807) % 2147483647;
            let j = s % (i + 1);
            [p[i], p[j]] = [p[j], p[i]];
        }
        for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
    }
    fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    lerp(a, b, t) { return a + t * (b - a); }
    grad(hash, x, y) {
        let h = hash & 3;
        let u = h < 2 ? x : y;
        let v = h < 2 ? y : x;
        return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    }
    noise2D(x, y) {
        let X = Math.floor(x) & 255;
        let Y = Math.floor(y) & 255;
        x -= Math.floor(x);
        y -= Math.floor(y);
        let u = this.fade(x);
        let v = this.fade(y);
        let a = this.perm[X] + Y;
        let b = this.perm[X + 1] + Y;
        return this.lerp(
            this.lerp(this.grad(this.perm[a], x, y), this.grad(this.perm[b], x - 1, y), u),
            this.lerp(this.grad(this.perm[a + 1], x, y - 1), this.grad(this.perm[b + 1], x - 1, y - 1), u),
            v
        );
    }
    noise3D(x, y, z) {
        let X = Math.floor(x) & 255;
        let Y = Math.floor(y) & 255;
        let Z = Math.floor(z) & 255;
        x -= Math.floor(x);
        y -= Math.floor(y);
        z -= Math.floor(z);
        let u = this.fade(x);
        let v = this.fade(y);
        let w = this.fade(z);
        let A = this.perm[X] + Y;
        let AA = this.perm[A] + Z;
        let AB = this.perm[A + 1] + Z;
        let B = this.perm[X + 1] + Y;
        let BA = this.perm[B] + Z;
        let BB = this.perm[B + 1] + Z;
        return this.lerp(
            this.lerp(
                this.lerp(this.grad3(this.perm[AA], x, y, z), this.grad3(this.perm[BA], x - 1, y, z), u),
                this.lerp(this.grad3(this.perm[AB], x, y - 1, z), this.grad3(this.perm[BB], x - 1, y - 1, z), u),
                v
            ),
            this.lerp(
                this.lerp(this.grad3(this.perm[AA + 1], x, y, z - 1), this.grad3(this.perm[BA + 1], x - 1, y, z - 1), u),
                this.lerp(this.grad3(this.perm[AB + 1], x, y - 1, z - 1), this.grad3(this.perm[BB + 1], x - 1, y - 1, z - 1), u),
                v
            ),
            w
        );
    }
    grad3(hash, x, y, z) {
        let h = hash & 15;
        let u = h < 8 ? x : y;
        let v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    }
    octaveNoise(x, y, octaves = 4, persistence = 0.5, scale = 0.01) {
        let total = 0, frequency = scale, amplitude = 1, maxValue = 0;
        for (let i = 0; i < octaves; i++) {
            total += this.noise2D(x * frequency, y * frequency) * amplitude;
            maxValue += amplitude;
            amplitude *= persistence;
            frequency *= 2;
        }
        return total / maxValue;
    }
    octaveNoise3D(x, y, z, octaves = 4, persistence = 0.5, scale = 0.01) {
        let total = 0, frequency = scale, amplitude = 1, maxValue = 0;
        for (let i = 0; i < octaves; i++) {
            total += this.noise3D(x * frequency, y * frequency, z * frequency) * amplitude;
            maxValue += amplitude;
            amplitude *= persistence;
            frequency *= 2;
        }
        return total / maxValue;
    }
}

        ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) {
            if (Math.random() < 0.1) {
                ctx.fillStyle = `rgba(${Math.max(0,color[0]-20)}, ${Math.max(0,color[1]-20)}, ${Math.max(0,color[2]-20)}, 1)`;
                ctx.fillRect(i, j, 1, 1);
            }
        }
    } else if (WOOL_COLORS[type]) {
        const color = WOOL_COLORS[type];
        ctx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = `rgba(${Math.max(0,color[0]-30)}, ${Math.max(0,color[1]-30)}, ${Math.max(0,color[2]-30)}, 0.5)`;
        ctx.lineWidth = 0.5;
        for (let y = 0; y < size; y += 2) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
        }
        for (let x = 0; x < size; x += 2) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, size); ctx.stroke();
        }
    } else if ([230, 231, 237, 238].includes(type)) {
        ctx.strokeStyle = c[1]; ctx.lineWidth = 1;
        for (let y = 0; y < size; y += 4) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
        }
        for (let y = 0; y < size; y += 4) {
            const offset = (y / 4) % 2 === 0 ? 0 : 4;
            for (let x = offset; x < size; x += 8) {
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 4); ctx.stroke();
            }
        }
    } else if (type === 336) {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 4, size, size-8);
        ctx.fillStyle = '#000000'; ctx.font = 'bold 4px Arial'; ctx.textAlign = 'center';
        ctx.fillText('TNT', size/2, size/2);
    } else if (type === 390) {
        for (let i = 0; i < 10; i++) {
            const x = Math.random() * size, y = Math.random() * size;
            ctx.fillStyle = `rgba(255, ${100 + Math.random()*100}, 0, 0.8)`;
            ctx.beginPath(); ctx.arc(x, y, 1 + Math.random() * 2, 0, Math.PI * 2); ctx.fill();
        }
    }
    
    return canvas;
}

function generateHDTexture(type) {
    const lowRes = generateTexture(type, 16);
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(lowRes, 0, 0, 64, 64);
    
    if (type !== 14 && !STAINED_GLASS_BLOCKS.has(type) && type !== 166 && type !== 167 && type !== 168 && !FLOWER_COLORS[type]) {
        const imageData = ctx.getImageData(0, 0, 64, 64);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            const noise = (Math.random() - 0.5) * 20;
            data[i] = Math.max(0, Math.min(255, data[i] + noise));
            data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
            data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
        }
        ctx.putImageData(imageData, 0, 0);
    }
    return canvas;
}

// ========== 生物群系生成器 ==========
class BiomeGenerator {
    constructor(seed) {
        this.seed = seed;
        this.tempNoise = new NoiseGenerator(seed);
        this.humidityNoise = new NoiseGenerator(seed + 1);
        this.biomeNoise = new NoiseGenerator(seed + 2);
        this.detailNoise = new NoiseGenerator(seed + 3);
        this.mountainNoise = new NoiseGenerator(seed + 4);
        this.riverNoise = new NoiseGenerator(seed + 5);
        this.caveNoise = new NoiseGenerator(seed + 6);
        this.caveEntranceNoise = new NoiseGenerator(seed + 7);
        this.structureNoise = new NoiseGenerator(seed + 8);
    }
    
    getBiome(x, z) {
        const temp = this.tempNoise.octaveNoise(x, z, 4, 0.5, 0.003);
        const humidity = this.humidityNoise.octaveNoise(x, z, 4, 0.5, 0.003);
        const biomeVar = this.biomeNoise.octaveNoise(x, z, 3, 0.5, 0.005);
        const detail = this.detailNoise.noise2D(x * 0.02, z * 0.02);
        
        return this.getOverworldBiome(temp, humidity, biomeVar, detail, x, z);
    }
    
    getOverworldBiome(temp, humidity, biomeVar, detail, x, z) {
        const oceanNoise = this.biomeNoise.octaveNoise(x, z, 3, 0.5, 0.002);
        if (oceanNoise < -0.4) {
            if (temp > 0.7) return BIOMES.WARM_OCEAN;
            if (temp > 0.4) return oceanNoise < -0.6 ? BIOMES.LUKEWARM_DEEP_OCEAN : BIOMES.LUKEWARM_OCEAN;
            if (temp > 0.0) return oceanNoise < -0.6 ? BIOMES.DEEP_OCEAN : BIOMES.OCEAN;
            if (temp > -0.3) return oceanNoise < -0.6 ? BIOMES.COLD_DEEP_OCEAN : BIOMES.COLD_OCEAN;
            return oceanNoise < -0.6 ? BIOMES.FROZEN_DEEP_OCEAN : BIOMES.FROZEN_OCEAN;
        }
        
        const riverNoise = this.riverNoise.octaveNoise(x, z, 3, 0.5, 0.004);
        if (Math.abs(riverNoise) < 0.03) {
            return temp < -0.3 ? BIOMES.FROZEN_RIVER : BIOMES.RIVER;
        }
        
        const height = this.getHeight(x, z);
        if (height <= 22 && height > 18) {
            if (temp < -0.3) return BIOMES.SNOWY_BEACH;
            return BIOMES.BEACH;
        }
        if (height <= 18 && height > 15) {
            return BIOMES.STONY_SHORE;
        }
        
        if (height > 55) {
            if (temp < -0.5) return BIOMES.JAGGED_PEAKS;
            if (temp < -0.2) return BIOMES.FROZEN_PEAKS;
            return BIOMES.STONY_PEAKS;
        }
        if (height > 45) {
            if (temp < -0.3) return BIOMES.SNOWY_SLOPES;
            if (temp < 0.0) return BIOMES.GROVE;
            return BIOMES.WINDSWEPT_HILLS;
        }
        if (height > 38) {
            return biomeVar > 0 ? BIOMES.WINDSWEPT_FOREST : BIOMES.MEADOW;
        }
        if (height > 34 && biomeVar < -0.2) {
            return BIOMES.WINDSWEPT_GRAVELLY_HILLS;
        }
        
        if (temp < -0.3) {
            if (humidity > 0.5) return BIOMES.SNOWY_TAIGA;
            if (biomeVar > 0.3) return BIOMES.ICE_SPIKES;
            return BIOMES.SNOWY_PLAINS;
        }
        
        if (temp < 0.2) {
            if (humidity > 0.7) return BIOMES.SWAMP;
            if (humidity > 0.5) {
                return biomeVar > 0.3 ? BIOMES.OLD_GROWTH_PINE_TAIGA : 
                       biomeVar > 0 ? BIOMES.OLD_GROWTH_SPRUCE_TAIGA : BIOMES.TAIGA;
            }
            if (humidity > 0.3) return biomeVar > 0.3 ? BIOMES.DARK_FOREST : BIOMES.FOREST;
            return BIOMES.WINDSWEPT_GRAVELLY_HILLS;
        }
        
        if (temp < 0.5) {
            if (humidity > 0.8) return BIOMES.JUNGLE;
            if (humidity > 0.6) {
                return biomeVar > 0.3 ? BIOMES.OLD_BIRCH_FOREST : 
                       biomeVar > 0 ? BIOMES.BIRCH_FOREST : BIOMES.FOREST;
            }
            if (humidity > 0.4) {
                return biomeVar > 0.5 ? BIOMES.FLOWER_FOREST : 
                       biomeVar > 0 ? BIOMES.SUNFLOWER_PLAINS : BIOMES.PLAINS;
            }
            if (humidity > 0.2) return BIOMES.SAVANNA;
            return BIOMES.DESERT;
        }
        
        if (humidity > 0.7) return biomeVar > 0.3 ? BIOMES.BAMBOO_JUNGLE : BIOMES.SPARSE_JUNGLE;
        if (humidity > 0.5) return BIOMES.SPARSE_JUNGLE;
        if (humidity > 0.3) return biomeVar > 0 ? BIOMES.SAVANNA_PLATEAU : BIOMES.SAVANNA;
        if (humidity > 0.1) {
            return biomeVar > 0.3 ? BIOMES.WOODED_BADLANDS : 
                   biomeVar > 0 ? BIOMES.ERODED_BADLANDS : BIOMES.BADLANDS;
        }
        return biomeVar > 0 ? BIOMES.ERODED_BADLANDS : BIOMES.DESERT;
    }
    
    getHeight(x, z) {
        const scale = 0.015;
        const baseHeight = this.tempNoise.octaveNoise(x, z, 5, 0.5, scale);
        let height = Math.floor((baseHeight + 1) * 15 + 20);
        
        const mountainValue = this.mountainNoise.octaveNoise(x, z, 4, 0.6, 0.008);
        if (mountainValue > 0.3) {
            const mountainHeight = (mountainValue - 0.3) * 80;
            height += Math.floor(mountainHeight);
        }
        
        const riverNoise = this.riverNoise.octaveNoise(x, z, 3, 0.5, 0.004);
        if (Math.abs(riverNoise) < 0.03) {
            height = Math.min(height, 25);
        }
        
        return Math.max(1, Math.min(height, 80));
    }
    
    isCave(x, y, z) {
        if (y < 3 || y > 50) return false;
        
        const caveNoise1 = this.caveNoise.octaveNoise3D(x, y, z, 3, 0.5, 0.03);
        const caveNoise2 = this.caveNoise.octaveNoise3D(x + 100, y, z, 3, 0.5, 0.025);
        
        if (caveNoise1 > 0.6 && caveNoise2 > 0.3) return true;
        
        const largeCaveNoise = this.caveNoise.octaveNoise3D(x, y * 2, z, 2, 0.5, 0.015);
        if (largeCaveNoise > 0.7) return true;
        
        return false;
    }
    
    isCaveEntrance(x, z, surfaceHeight) {
        const entranceNoise = this.caveEntranceNoise.octaveNoise(x, z, 3, 0.5, 0.02);
        return entranceNoise > 0.5;
    }
    
    getCaveEntranceDepth(x, z) {
        const entranceNoise = this.caveEntranceNoise.octaveNoise(x, z, 3, 0.5, 0.02);
        return Math.floor((entranceNoise - 0.5) * 20);
    }
    
    // 结构生成概率检测
    shouldGenerateStructure(x, z, structureType) {
        const noise = this.structureNoise.noise2D(x * 0.1, z * 0.1);
        const seed = (x * 73856093) ^ (z * 19349663) ^ structureType;
        const random = ((seed % 1000) / 1000 + 1) % 1;
        
        const chances = {
            'village': 0.002,
            'desert_temple': 0.001,
            'jungle_temple': 0.001,
            'swamp_hut': 0.002,
            'igloo': 0.001,
            'pillager_outpost': 0.002,
            'woodland_mansion': 0.0005,
            'ruined_portal': 0.005,
            'mineshaft': 0.01,
            'stronghold': 0.001,
            'fossil': 0.01,
            'desert_well': 0.01,
            'ocean_monument': 0.002,
            'shipwreck': 0.005,
            'ocean_ruin': 0.005,
            'buried_treasure': 0.005,
            'nether_fortress': 0.002,
            'bastion_remnant': 0.002,
            'end_city': 0.001
        };
        
        return random < (chances[structureType] || 0.001);
    }
}

// ========== 结构生成器 ==========
class StructureGenerator {
    constructor(seed) {
        this.seed = seed;
    }
    
    tryGenerateStructure(world, chunk, cx, cz, startX, startZ) {
        const biome = world.getBiomeAt(startX, startZ);
        
        // 检查并生成结构
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'village')) {
            this.generateVillage(world, chunk, cx, cz, startX, startZ, biome);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'desert_temple')) {
            this.generateDesertTemple(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'jungle_temple')) {
            this.generateJungleTemple(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'swamp_hut')) {
            this.generateSwampHut(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'igloo')) {
            this.generateIgloo(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'pillager_outpost')) {
            this.generatePillagerOutpost(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'woodland_mansion')) {
            this.generateWoodlandMansion(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'ruined_portal')) {
            this.generateRuinedPortal(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'mineshaft')) {
            this.generateMineshaft(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'stronghold')) {
            this.generateStronghold(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'fossil')) {
            this.generateFossil(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'desert_well')) {
            this.generateDesertWell(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'ocean_monument')) {
            this.generateOceanMonument(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'shipwreck')) {
            this.generateShipwreck(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'ocean_ruin')) {
            this.generateOceanRuin(world, chunk, cx, cz, startX, startZ);
        }
        if (world.biomeGen.shouldGenerateStructure(startX, startZ, 'buried_treasure')) {
            this.generateBuriedTreasure(world, chunk, cx, cz, startX, startZ);
        }
    }
    
    setBlock(chunk, x, y, z, type, chunkSize, worldHeight) {
        if (x >= 0 && x < chunkSize && y >= 0 && y < worldHeight && z >= 0 && z < chunkSize) {
            chunk[x][y][z] = type;
        }
    }
    
    // 村庄生成
    generateVillage(world, chunk, cx, cz, startX, startZ, biome) {
        const height = world.biomeGen.getHeight(startX, startZ);
        const chunkSize = world.chunkSize;
        const worldHeight = world.worldHeight;
        
        // 根据生物群系选择建筑材料
        let wallBlock, roofBlock, floorBlock;
        if (biome.id === 'desert') {
            wallBlock = BLOCK_TYPES.SANDSTONE;
            roofBlock = BLOCK_TYPES.SANDSTONE;
            floorBlock = BLOCK_TYPES.SANDSTONE;
        } else if (biome.id === 'savanna' || biome.id === 'savanna_plateau') {
            wallBlock = BLOCK_TYPES.ACACIA_PLANKS;
            roofBlock = BLOCK_TYPES.ACACIA_LOG;
            floorBlock = BLOCK_TYPES.ACACIA_PLANKS;
        } else if (biome.id === 'snowy_plains' || biome.id === 'snowy_taiga') {
            wallBlock = BLOCK_TYPES.SPRUCE_PLANKS;
            roofBlock = BLOCK_TYPES.SNOW;
            floorBlock = BLOCK_TYPES.SPRUCE_PLANKS;
        } else {
            wallBlock = BLOCK_TYPES.PLANKS;
            roofBlock = BLOCK_TYPES.WOOD;
            floorBlock = BLOCK_TYPES.PLANKS;
        }
        
        // 生成几座房屋
        for (let i = 0; i < 3; i++) {
            const offsetX = Math.floor(Math.random() * 10) + 2;
            const offsetZ = Math.floor(Math.random() * 10) + 2;
            const houseHeight = 4;
            
            // 房屋墙壁
            for (let x = 0; x < 5; x++) {
                for (let y = 0; y < houseHeight; y++) {
                    this.setBlock(chunk, offsetX + x, height + y, offsetZ, wallBlock, chunkSize, worldHeight);
                    this.setBlock(chunk, offsetX + x, height + y, offsetZ + 4, wallBlock, chunkSize, worldHeight);
                }
            }
            for (let z = 0; z < 5; z++) {
                for (let y = 0; y < houseHeight; y++) {
                    this.setBlock(chunk, offsetX, height + y, offsetZ + z, wallBlock, chunkSize, worldHeight);
                    this.setBlock(chunk, offsetX + 4, height + y, offsetZ + z, wallBlock, chunkSize, worldHeight);
                }
            }
            
            // 地板
            for (let x = 0; x < 5; x++) {
                for (let z = 0; z < 5; z++) {
                    this.setBlock(chunk, offsetX + x, height - 1, offsetZ + z, floorBlock, chunkSize, worldHeight);
                }
            }
            
            // 屋顶
            for (let x = 0; x < 5; x++) {
                for (let z = 0; z < 5; z++) {
                    this.setBlock(chunk, offsetX + x, height + houseHeight, offsetZ + z, roofBlock, chunkSize, worldHeight);
                }
            }
            
            // 门
            this.setBlock(chunk, offsetX + 2, height, offsetZ + 2, BLOCK_TYPES.AIR, chunkSize, worldHeight);
            this.setBlock(chunk, offsetX + 2, height + 1, offsetZ + 2, BLOCK_TYPES.AIR, chunkSize, worldHeight);
            
            // 工作台和熔炉
            this.setBlock(chunk, offsetX + 1, height, offsetZ + 1, BLOCK_TYPES.CRAFTING_TABLE, chunkSize, worldHeight);
            this.setBlock(chunk, offsetX + 3, height, offsetZ + 1, BLOCK_TYPES.FURNACE, chunkSize, worldHeight);
        }
    }
    
    // 沙漠神殿
    generateDesertTemple(world, chunk, cx, cz, startX, startZ) {
        const height = world.biomeGen.getHeight(startX, startZ);
        const chunkSize = world.chunkSize;
        const worldHeight = world.worldHeight;
        
        // 金字塔形状
        for (let y = 0; y < 8; y++) {
            for (let x = y; x < 16 - y; x++) {
                for (let z = y; z < 16 - y; z++) {
                    this.setBlock(chunk, x, height + y, z, BLOCK_TYPES.SANDSTONE, chunkSize, worldHeight);
                }
            }
        }
        
        // 内部空间
        for (let y = 1; y < 7; y++) {
            for (let x = 4; x < 12; x++) {
                for (let z = 4; z < 12; z++) {
                    this.setBlock(chunk, x, height + y, z, BLOCK_TYPES.AIR, chunkSize, worldHeight);
                }
            }
        }
        
        // 地下室和TNT陷阱
        for (let y = 1; y < 4; y++) {
            for (let x = 5; x < 11; x++) {
                for (let z = 5; z < 11; z++) {
                    this.setBlock(chunk, x, height - y, z, BLOCK_TYPES.AIR, chunkSize, worldHeight);
                }
            }
        }
        
        // TNT
        this.setBlock(chunk, 8, height - 3, 8, BLOCK_TYPES.TNT, chunkSize, worldHeight);
        
        // 战利品箱
        this.setBlock(chunk, 6, height - 3, 6, BLOCK_TYPES.CHEST, chunkSize, worldHeight);
        this.setBlock(chunk, 10, height - 3, 6, BLOCK_TYPES.CHEST, chunkSize, worldHeight);
        this.setBlock(chunk, 6, height - 3, 10, BLOCK_TYPES.CHEST, chunkSize, worldHeight);
        this.setBlock(chunk, 10, height - 3, 10, BLOCK_TYPES.CHEST, chunkSize, worldHeight);
    }
    
    // 丛林神庙
    generateJungleTemple(world, chunk, cx, cz, startX, startZ) {
        const height = world.biomeGen.getHeight(startX, startZ);
        const chunkSize = world.chunkSize;
        const worldHeight = world.worldHeight;
        
        // 石砖建筑
        for (let y = 0; y < 6; y++) {
            for (let x = 2; x < 14; x++) {
                this.setBlock(chunk, x, height + y, 2, BLOCK_TYPES.STONE_BRICKS, chunkSize, worldHeight);
                this.setBlock(chunk, x, height + y, 13, BLOCK_TYPES.STONE_BRICKS, chunkSize, worldHeight);
            }
            for (let z = 2; z < 14; z++) {
                this.setBlock(chunk, 2, height + y, z, BLOCK_TYPES.STONE_BRICKS, chunkSize, worldHeight);
                this.setBlock(chunk, 13, height + y, z, BLOCK_TYPES.STONE_BRICKS, chunkSize, worldHeight);
            }
        }
        
        // 内部空间
        for (let y = 1; y < 5; y++) {
            for (let x = 3; x < 13; x++) {
                for (let z = 3; z < 13; z++) {
                    this.setBlock(chunk, x, height + y, z, BLOCK_TYPES.AIR, chunkSize, worldHeight);
                }
            }
        }
        
        // 地板
        for (let x = 3; x < 13; x++) {
            for (let z = 3; z < 13; z++) {
                this.setBlock(chunk, x, height, z, BLOCK_TYPES.STONE_BRICKS, chunkSize, worldHeight);
            }
        }
        
        // 屋顶
        for (let x = 2; x < 14; x++) {
            for (let z = 2; z < 14; z++) {
                this.setBlock(chunk, x, height + 6, z, BLOCK_TYPES.STONE_BRICKS, chunkSize, worldHeight);
            }
        }
        
        // 战利品箱
        this.setBlock(chunk, 8, height + 1, 8, BLOCK_TYPES.CHEST, chunkSize, worldHeight);
    }
    
    // 沼泽小屋
    generateSwampHut(world, chunk, cx, cz, startX, startZ) {
        const height = world.biomeGen.getHeight(startX, startZ);
        const chunkSize = world.chunkSize;
        const worldHeight = world.worldHeight;
        
        // 小木屋
        for (let y = 0; y < 4; y++) {
            for (let x = 5; x < 11; x++) {
                this.setBlock(chunk, x, height + y, 5, BLOCK_TYPES.SPRUCE_PLANKS, chunkSize, worldHeight);
                this.setBlock(chunk, x, height + y, 10, BLOCK_TYPES.SPRUCE_PLANKS, chunkSize, worldHeight);
            }
            for (let z = 5; z < 11; z++) {
                this.setBlock(chunk, 5, height + y, z, BLOCK_TYPES.SPRUCE_PLANKS, chunkSize, worldHeight);
                this.setBlock(chunk, 10, height + y, z, BLOCK_TYPES.SPRUCE_PLANKS, chunkSize, worldHeight);
            }
        }
        
        // 内部空间
        for (let y = 1; y < 3; y++) {
            for (let x = 6; x < 10; x++) {
                for (let z = 6; z < 10; z++) {
                    this.setBlock(chunk, x, height + y, z, BLOCK_TYPES.AIR, chunkSize, worldHeight);
                }
            }
        }
        
        // 地板和屋顶
        for (let x = 5; x < 11; x++) {
            for (let z = 5; z < 11; z++) {
                this.setBlock(chunk, x, height, z, BLOCK_TYPES.SPRUCE_PLANKS, chunkSize, worldHeight);
                this.setBlock(chunk, x, height + 4, z, BLOCK_TYPES.SPRUCE_PLANKS, chunkSize, worldHeight);
            }
        }
        
        // 炼药锅
        this.setBlock(chunk, 7, height + 1, 7, BLOCK_TYPES.CAULDRON, chunkSize, worldHeight);
        
        // 门
        this.setBlock(chunk, 7, height, 5, BLOCK_TYPES.AIR, chunkSize, worldHeight);
        this.setBlock(chunk, 7, height + 1, 5, BLOCK_TYPES.AIR, chunkSize, worldHeight);
    }
    
    // 雪屋
    generateIgloo(world, chunk, cx, cz, startX, startZ) {

        const chunkSize = world.chunkSize;
        const worldHeight = world.worldHeight;
        
        // 雪块圆顶
        for (let y = 0; y < 3; y++) {
            for (let x = 5; x < 11; x++) {
                for (let z = 5; z < 11; z++) {
                    if (Math.abs(x - 7.5) + Math.abs(z - 7.5) + y < 4) {
                        this.setBlock(chunk, x, height + y, z, BLOCK_TYPES.SNOW, chunkSize, worldHeight);
                    }
                }
            }
        }
        
        // 内部空间
        for (let y = 0; y < 2; y++) {
            for (let x = 6; x < 10; x++) {
                for (let z = 6; z < 10; z++) {
                    this.setBlock(chunk, x, height + y, z, BLOCK_TYPES.AIR, chunkSize, worldHeight);
                }
            }
        }
        
        // 地板
        for (let x = 5; x < 11; x++) {
            for (let z = 5; z < 11; z++) {
                this.setBlock(chunk, x, height - 1, z, BLOCK_TYPES.SNOW, chunkSize, worldHeight);
            }
        }
        
        // 门
        this.setBlock(chunk, 7, height, 5, BLOCK_TYPES.AIR, chunkSize, worldHeight);
