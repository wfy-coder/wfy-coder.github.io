<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D 2048 · 立方之舞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a1418;
    --bg-2: #142028;
    --fg: #e8f4f1;
    --muted: #6b8a87;
    --accent: #00ffc8;
    --accent-2: #ff5e62;
    --gold: #ffd700;
    --card: rgba(20, 32, 40, 0.6);
    --border: rgba(0, 255, 200, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg-1);
    color: var(--fg);
    font-family: 'Noto Sans SC', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .bg-gradient {
    position: fixed; inset: 0; z-index: 0;
    background: 
      radial-gradient(ellipse at 15% 25%, rgba(0, 255, 200, 0.10), transparent 55%),
      radial-gradient(ellipse at 85% 75%, rgba(255, 94, 98, 0.08), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(255, 215, 0, 0.04), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: 
      linear-gradient(rgba(0, 255, 200, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 200, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  #canvas-container { position: fixed; inset: 0; z-index: 1; }
  .ui-overlay {
    position: fixed; inset: 0; z-index: 10;
    pointer-events: none;
    padding: 24px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand { pointer-events: auto; }
  .brand h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 4vw, 46px);
    letter-spacing: 3px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 60%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
    filter: drop-shadow(0 4px 24px rgba(0, 255, 200, 0.25));
  }
  .brand .sub {
    font-size: 11px; color: var(--muted);
    letter-spacing: 5px; margin-top: 6px;
    text-transform: uppercase;
    font-family: 'Orbitron', sans-serif;
  }
  .scores { display: flex; gap: 12px; pointer-events: auto; }
  .score-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    min-width: 100px;
    overflow: visible;
  }
  .score-card .label {
    font-size: 10px; color: var(--muted);
    letter-spacing: 3px; text-transform: uppercase;
    font-family: 'Orbitron', sans-serif;
  }
  .score-card .value {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700; font-size: 24px;
    color: var(--fg); line-height: 1.1;
    margin-top: 2px;
  }
  .score-card.best .value { color: var(--gold); }
  .score-card .delta {
    position: absolute; right: 14px; top: 8px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700; color: var(--accent);
    font-size: 16px; pointer-events: none;
    animation: deltaFly 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    text-shadow: 0 0 12px var(--accent);
  }
  @keyframes deltaFly {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    25% { opacity: 1; transform: translateY(-8px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-50px) scale(0.9); }
  }
  .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .hint-panel, .ai-info {
    pointer-events: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    max-width: 340px;
  }
  .hint-panel .title, .ai-info .title {
    font-size: 10px; color: var(--accent);
    letter-spacing: 4px; text-transform: uppercase;
    margin-bottom: 8px; font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    display: flex; align-items: center; gap: 8px;
  }
  .ai-info .title { color: var(--accent-2); }
  .ai-info .title::before {
    content: ''; width: 6px; height: 6px;
    background: var(--accent-2); border-radius: 50%;
    animation: pulse 1.2s infinite;
    box-shadow: 0 0 12px var(--accent-2);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(1.4); }
  }
  .hint-panel .content { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .hint-panel kbd {
    display: inline-block;
    background: rgba(0, 255, 200, 0.08);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 7px;
    color: var(--fg);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    margin: 0 1px;
    box-shadow: 0 1px 0 rgba(0, 255, 200, 0.15);
  }
  .controls-panel {
    pointer-events: auto;
    display: flex; flex-direction: column;
    gap: 12px; align-items: flex-end;
  }
  .mode-switch {
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    backdrop-filter: blur(12px);
  }
  .mode-btn {
    background: transparent; border: none;
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px; font-weight: 700;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    letter-spacing: 1px;
  }
  .mode-btn:hover { color: var(--fg); }
  .mode-btn.active {
    background: linear-gradient(135deg, var(--accent), #00d9a8);
    color: #0a1418;
    box-shadow: 0 4px 24px rgba(0, 255, 200, 0.35);
  }
  .action-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 9px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px; font-weight: 700;
    backdrop-filter: blur(12px);
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .action-btn:hover {
    background: rgba(0, 255, 200, 0.1);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .ai-info { min-width: 280px; display: none; }
  .ai-info.active { display: block; }
  .ai-info .stat-row {
    display: flex; justify-content: space-between;
    font-size: 12px; margin-top: 6px;
    align-items: center;
  }
  .ai-info .stat-label { color: var(--muted); letter-spacing: 1px; }
  .ai-info .stat-value {
    color: var(--fg);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
  }
  .ai-info .move-display {
    color: var(--accent-2);
    font-size: 16px;
    text-shadow: 0 0 12px rgba(255, 94, 98, 0.5);
  }
  .ai-info .depth-bar {
    margin-top: 10px;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }
  .ai-info .depth-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-2), var(--gold));
    border-radius: 2px;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px var(--accent-2);
  }
  .ai-info .algo-tag {
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    line-height: 1.6;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .ai-info .algo-tag span { color: var(--accent); }
  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--fg);
    padding: 24px 48px;
    border-radius: 20px;
    backdrop-filter: blur(20px);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 4px;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .toast.win {
    border-color: var(--gold);
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,94,98,0.1));
    box-shadow: 0 0 100px rgba(255, 215, 0, 0.4);
    color: var(--gold);
  }
  .toast.over {
    border-color: var(--accent-2);
    box-shadow: 0 0 80px rgba(255, 94, 98, 0.3);
  }
  .toast .small {
    display: block; font-size: 13px;
    letter-spacing: 2px; color: var(--muted);
    margin-top: 10px; font-weight: 400;
    font-family: 'Noto Sans SC', sans-serif;
  }
  @media (max-width: 720px) {
    .ui-overlay { padding: 14px; }
    .brand h1 { font-size: 26px; letter-spacing: 2px; }
    .brand .sub { display: none; }
    .score-card { padding: 8px 12px; min-width: 80px; }
    .score-card .value { font-size: 18px; }
    .score-card .label { font-size: 9px; }
    .hint-panel { max-width: 180px; padding: 10px 12px; }
    .hint-panel .content { font-size: 11px; }
    .ai-info { min-width: 200px; padding: 10px 12px; }
    .ai-info .stat-value { font-size: 11px; }
    .mode-btn { padding: 7px 12px; font-size: 12px; }
    .action-btn { padding: 7px 12px; font-size: 12px; }
    .toast { font-size: 26px; padding: 18px 32px; }
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>
  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <div class="top-bar">
      <div class="brand">
        <h1>3D · 2048</h1>
        <div class="sub">CUBE DANCE</div>
      </div>
      <div class="scores">
        <div class="score-card" id="score-card">
          <div class="label">分数</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-card best">
          <div class="label">最高</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="hint-panel" id="hint-panel">
        <div class="title">操作指南</div>
        <div class="content">
          <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>WASD</kbd> 移动<br>
          <kbd>拖拽</kbd> 朝任意方向滑动<br>
          合成 <strong style="color:var(--gold)">2048</strong> 即可获胜
        </div>
      </div>

      <div class="ai-info" id="ai-info">
        <div class="title">AI 自主决策</div>
        <div class="stat-row">
          <span class="stat-label">搜索深度</span>
          <span class="stat-value" id="ai-depth">3</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">评估节点</span>
          <span class="stat-value" id="ai-nodes">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">当前决策</span>
          <span class="stat-value move-display" id="ai-move">—</span>
        </div>
        <div class="depth-bar"><div class="depth-fill" id="depth-fill" style="width:0%"></div></div>
        <div class="algo-tag">
          算法 · <span>Expectimax</span> + 多维启发式评估<br>
          策略 · <span>空格权重 / 单调性 / 平滑度 / 蛇形排列</span>
        </div>
      </div>

      <div class="controls-panel">
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="manual">自己玩</button>
          <button class="mode-btn" data-mode="ai">AI 自动</button>
        </div>
        <button class="action-btn" id="restart-btn">重新开始</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';

  // ====================== 配置常量 ======================
  const SIZE = 4;
  const CELL = 1.08;
  const TILE_SIZE = 0.92;

  // 数字对应颜色（HSL 渐变：青→绿→黄→橙→红→品红→金）
  const COLORS = {
    2:    { c: 0x4ecdc4, e: 0x2a9d8f, dark: true  },
    4:    { c: 0x06d6a0, e: 0x048a6a, dark: true  },
    8:    { c: 0xa3e635, e: 0x65a30d, dark: true  },
    16:   { c: 0xfacc15, e: 0xca8a04, dark: true  },
    32:   { c: 0xfb923c, e: 0xc2410c, dark: false },
    64:   { c: 0xf87171, e: 0xb91c1c, dark: false },
    128:  { c: 0xef4444, e: 0x7f1d1d, dark: false },
    256:  { c: 0xec4899, e: 0x9d174d, dark: false },
    512:  { c: 0xd946ef, e: 0x86198f, dark: false },
    1024: { c: 0xffd700, e: 0xb8860b, dark: false },
    2048: { c: 0xff4d6d, e: 0xc81d25, dark: false },
    4096: { c: 0x00ffff, e: 0x00aaaa, dark: false }
  };

  // 根据数字获取方块高度 —— 数字越大越高
  function getTileHeight(value) {
    return 0.30 + Math.log2(value) * 0.075;
  }

  // ====================== Three.js 场景 ======================
  let scene, camera, renderer, boardGroup;
  let bgParticles, decorations = [];
  let particles = [];
  let trails = [];
  let clock;

  function initScene() {
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a1418, 14, 28);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 7.5, 6.8);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);
    keyLight.position.set(5, 10, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -5;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x00ffc8, 0.35);
    fillLight.position.set(-5, 4, -3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xff5e62, 0.3);
    rimLight.position.set(0, 3, -8);
    scene.add(rimLight);

    createBoard();
    createBackgroundParticles();
    createDecorations();

    clock = new THREE.Clock();
  }

  function gridToWorld(row, col) {
    return {
      x: col * CELL - (SIZE - 1) * CELL / 2,
      z: row * CELL - (SIZE - 1) * CELL / 2
    };
  }

  function createBoard() {
    boardGroup = new THREE.Group();
    scene.add(boardGroup);

    const baseGeo = new THREE.BoxGeometry(4.8, 0.5, 4.8, 3, 1, 3);
    const pos = baseGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      if (pos.getY(i) > 0) {
        pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * 0.04);
        pos.setZ(i, pos.getZ(i) + (Math.random() - 0.5) * 0.04);
      }
    }
    baseGeo.computeVertexNormals();
    const baseMat = new THREE.MeshStandardMaterial({
      color: 0x1a2a32, roughness: 0.7, metalness: 0.35, flatShading: true
    });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = -0.25;
    base.receiveShadow = true;
    boardGroup.add(base);

    const ringGeo = new THREE.TorusGeometry(3.45, 0.04, 8, 48);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x00ffc8, transparent: true, opacity: 0.7
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.02;
    boardGroup.add(ring);

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const slotGeo = new THREE.BoxGeometry(0.97, 0.12, 0.97);
        const slotMat = new THREE.MeshStandardMaterial({
          color: 0x050d10, roughness: 0.95, metalness: 0.1, flatShading: true
        });
        const slot = new THREE.Mesh(slotGeo, slotMat);
        const { x, z } = gridToWorld(r, c);
        slot.position.set(x, 0.07, z);
        slot.receiveShadow = true;
        boardGroup.add(slot);
      }
    }

    const cornerPositions = [[-2.3, -2.3], [2.3, -2.3], [-2.3, 2.3], [2.3, 2.3]];
    cornerPositions.forEach(([x, z]) => {
      const cornerGeo = new THREE.OctahedronGeometry(0.12, 0);
      const cornerMat = new THREE.MeshStandardMaterial({
        color: 0x00ffc8, emissive: 0x00ffc8,
        emissiveIntensity: 1.5, flatShading: true
      });
      const corner = new THREE.Mesh(cornerGeo, cornerMat);
      corner.position.set(x, 0.4, z);
      corner.userData = { baseY: 0.4, phase: Math.random() * Math.PI * 2 };
      boardGroup.add(corner);
      decorations.push(corner);
    });
  }

  const textTextureCache = {};
  function getTextTexture(value) {
    if (textTextureCache[value]) return textTextureCache[value];
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 256, 256);

    const colorObj = COLORS[value] || COLORS[2048];
    ctx.fillStyle = colorObj.dark ? '#0a1418' : '#ffffff';
    const fontSize = value < 100 ? 130 : value < 1000 ? 100 : 75;
    ctx.font = `900 ${fontSize}px Orbitron, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = colorObj.dark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 8;
    ctx.fillText(value, 128, 138);

    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = 8;
    textTextureCache[value] = tex;
    return tex;
  }

  // 创建方块 —— 高度随数字变化
  function createTileMesh(value) {
    const group = new THREE.Group();
    const colorObj = COLORS[value] || COLORS[2048];
    const height = getTileHeight(value);

    const geo = new THREE.BoxGeometry(TILE_SIZE, height, TILE_SIZE, 1, 1, 1);
    const mat = new THREE.MeshStandardMaterial({
      color: colorObj.c,
      emissive: colorObj.e,
      emissiveIntensity: value >= 1024 ? 0.5 : 0.3,
      roughness: 0.35,
      metalness: 0.45,
      flatShading: true
    });
    const cube = new THREE.Mesh(geo, mat);
    cube.castShadow = true;
    cube.receiveShadow = true;
    group.add(cube);

    const tex = getTextTexture(value);
    const textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
    const textGeoTop = new THREE.PlaneGeometry(0.78, 0.78);

    const textTop = new THREE.Mesh(textGeoTop, textMat);
    textTop.rotation.x = -Math.PI / 2;
    textTop.position.y = height / 2 + 0.01;
    group.add(textTop);

    // 正面文字 —— 根据高度适配尺寸
    const frontTextH = Math.min(0.78, height * 0.8);
    const textGeoFront = new THREE.PlaneGeometry(frontTextH, frontTextH);
    const textFront = new THREE.Mesh(textGeoFront, textMat);
    textFront.position.z = TILE_SIZE / 2 + 0.01;
    group.add(textFront);

    if (value >= 256) {
      const haloGeo = new THREE.TorusGeometry(0.55, 0.025, 6, 24);
      const haloMat = new THREE.MeshBasicMaterial({
        color: colorObj.c, transparent: true, opacity: 0.7
      });
      const halo = new THREE.Mesh(haloGeo, haloMat);
      halo.rotation.x = Math.PI / 2;
      halo.position.y = height / 2 + 0.02;
      group.add(halo);
      group.userData.halo = halo;
    }

    group.userData.cube = cube;
    group.userData.value = value;
    group.userData.height = height;
    return group;
  }

  function createBackgroundParticles() {
    const count = 220;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      positions[i*3]   = (Math.random() - 0.5) * 32;
      positions[i*3+1] = (Math.random() - 0.5) * 18;
      positions[i*3+2] = (Math.random() - 0.5) * 22 - 4;
      const t = Math.random();
      if (t < 0.5) {
        colors[i*3] = 0; colors[i*3+1] = 1; colors[i*3+2] = 0.78;
      } else if (t < 0.85) {
        colors[i*3] = 1; colors[i*3+1] = 0.37; colors[i*3+2] = 0.38;
      } else {
        colors[i*3] = 1; colors[i*3+1] = 0.84; colors[i*3+2] = 0;
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.08, vertexColors: true,
      transparent: true, opacity: 0.7,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    bgParticles = new THREE.Points(geo, mat);
    scene.add(bgParticles);
  }

  function createDecorations() {
    for (let i = 0; i < 18; i++) {
      const type = Math.floor(Math.random() * 3);
      let geo;
      const size = 0.3 + Math.random() * 0.5;
      if (type === 0) geo = new THREE.TetrahedronGeometry(size);
      else if (type === 1) geo = new THREE.OctahedronGeometry(size);
      else geo = new THREE.IcosahedronGeometry(size, 0);

      const isAccent = Math.random() < 0.4;
      const color = isAccent ? 0xff5e62 : (Math.random() < 0.5 ? 0x00ffc8 : 0xffd700);
      const mat = new THREE.MeshStandardMaterial({
        color, emissive: color,
        emissiveIntensity: 0.4,
        flatShading: true,
        transparent: true,
        opacity: 0.35
      });
      const mesh = new THREE.Mesh(geo, mat);
      const angle = Math.random() * Math.PI * 2;
      const radius = 9 + Math.random() * 7;
      mesh.position.set(
        Math.cos(angle) * radius,
        -1.5 + Math.random() * 7,
        Math.sin(angle) * radius - 2
      );
      mesh.userData = {
        rotSpeed: new THREE.Vector3(
          (Math.random() - 0.5) * 0.4,
          (Math.random() - 0.5) * 0.4,
          (Math.random() - 0.5) * 0.4
        ),
        floatPhase: Math.random() * Math.PI * 2,
        floatSpeed: 0.2 + Math.random() * 0.4,
        baseY: mesh.position.y
      };
      scene.add(mesh);
      decorations.push(mesh);
    }
  }

  // ====================== 游戏逻辑 ======================
  class Game {
    constructor() {
      this.grid = [];
      this.tiles = [];
      this.score = 0;
      this.best = parseInt(localStorage.getItem('best3d2048') || '0');
      this.isAnimating = false;
      this.gameOver = false;
      this.won = false;
      this.aiMode = false;
      this.aiTimer = null;
      this.init();
    }

    init() {
      if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
      this.grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      this.score = 0;
      this.gameOver = false;
      this.won = false;
      this.isAnimating = false;

      this.tiles.forEach(t => this.disposeTile(t));
      this.tiles = [];

      particles.forEach(p => {
        boardGroup.remove(p);
        p.geometry.dispose(); p.material.dispose();
      });
      particles = [];
      trails.forEach(t => {
        boardGroup.remove(t.line);
        t.line.geometry.dispose(); t.line.material.dispose();
      });
      trails = [];

      this.addRandomTile();
      this.addRandomTile();
      this.updateUI();

      if (this.aiMode) {
        this.aiTimer = setTimeout(aiStep, 600);
      }
    }

    disposeTile(tile) {
      if (tile.mesh && tile.mesh.parent) tile.mesh.parent.remove(tile.mesh);
      tile.mesh.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
          else o.material.dispose();
        }
      });
    }

    addRandomTile() {
      const empty = [];
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (!this.grid[r][c]) empty.push([r, c]);
      if (empty.length === 0) return null;

      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      const value = Math.random() < 0.9 ? 2 : 4;
      const mesh = createTileMesh(value);
      const { x, z } = gridToWorld(r, c);
      const h = getTileHeight(value);
      mesh.position.set(x, h / 2 + 0.08, z);
      mesh.scale.set(0, 0, 0);
      boardGroup.add(mesh);

      const tile = { mesh, value, row: r, col: c, isNew: true, merged: false };
      this.grid[r][c] = tile;
      this.tiles.push(tile);
      animateScale(mesh, 0, 1, 280, () => { tile.isNew = false; });
      return tile;
    }

    async move(direction) {
      if (this.isAnimating || this.gameOver) return false;
      this.isAnimating = true;

      let moved = false;
      let scoreGained = 0;
      const moves = [];
      const traversals = this.getTraversals(direction);
      this.tiles.forEach(t => t.merged = false);

      for (const r of traversals.rows) {
        for (const c of traversals.cols) {
          const tile = this.grid[r][c];
          if (!tile) continue;
          const { row: nr, col: nc } = this.findFarthest(r, c, direction);
          const next = this.getNextCell(nr, nc, direction);

          let merged = false;
          if (next.row >= 0 && next.row < SIZE && next.col >= 0 && next.col < SIZE) {
            const target = this.grid[next.row][next.col];
            if (target && target.value === tile.value && !target.merged) {
              target.merged = true;
              tile.merged = true;
              moves.push({
                tile, fromR: r, fromC: c, toR: next.row, toC: next.col,
                mergeWith: target
              });
              this.grid[r][c] = null;
              moved = true;
              merged = true;
            }
          }
          if (!merged && (nr !== r || nc !== c)) {
            moves.push({
              tile, fromR: r, fromC: c, toR: nr, toC: nc, mergeWith: null
            });
            this.grid[r][c] = null;
            this.grid[nr][nc] = tile;
            tile.row = nr; tile.col = nc;
            moved = true;
          }
        }
      }

      if (!moved) {
        this.isAnimating = false;
        return false;
      }

      const movePromises = [];
      for (const m of moves) {
        const { x: fromX, z: fromZ } = gridToWorld(m.fromR, m.fromC);
        const { x: toX, z: toZ } = gridToWorld(m.toR, m.toC);
        spawnTrail(fromX, fromZ, toX, toZ, m.tile.value);
        const p = animatePosition(m.tile.mesh, toX, toZ, 200);
        movePromises.push(p);

        if (m.mergeWith) {
          p.then(() => {
            this.removeTile(m.tile);
            this.removeTile(m.mergeWith);
            const newValue = m.tile.value * 2;
            const newMesh = createTileMesh(newValue);
            const { x, z } = gridToWorld(m.toR, m.toC);
            const newH = getTileHeight(newValue);
            newMesh.position.set(x, newH / 2 + 0.08, z);
            newMesh.scale.set(0, 0, 0);
            boardGroup.add(newMesh);

            const newTile = {
              mesh: newMesh, value: newValue,
              row: m.toR, col: m.toC, isNew: false, merged: true
            };
            this.grid[m.toR][m.toC] = newTile;
            this.tiles.push(newTile);

            animateScale(newMesh, 0, 1.18, 220, () => {
              animateScale(newMesh, 1.18, 1, 180);
            });

            spawnMergeParticles(x, newH + 0.1, z, newValue);
            scoreGained += newValue;

            if (newValue === 2048 && !this.won) {
              this.won = true;
              this.showWin();
              spawnCelebration();
            }
          });
        }
      }

      await Promise.all(movePromises);
      await sleep(240);

      this.addRandomTile();
      this.score += scoreGained;
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('best3d2048', this.best);
      }
      if (scoreGained > 0) this.showScoreDelta(scoreGained);
      this.updateUI();

      if (this.isGameOver()) {
        this.gameOver = true;
        this.showGameOver();
      }
      this.isAnimating = false;
      return true;
    }

    removeTile(tile) {
      const idx = this.tiles.indexOf(tile);
      if (idx >= 0) this.tiles.splice(idx, 1);
      this.disposeTile(tile);
    }

    getTraversals(direction) {
      const rows = [0, 1, 2, 3];
      const cols = [0, 1, 2, 3];
      if (direction === 'down') rows.reverse();
      if (direction === 'right') cols.reverse();
      return { rows, cols };
    }

    getNextCell(r, c, direction) {
      switch (direction) {
        case 'up':    return { row: r - 1, col: c };
        case 'down':  return { row: r + 1, col: c };
        case 'left':  return { row: r, col: c - 1 };
        case 'right': return { row: r, col: c + 1 };
      }
    }

    findFarthest(r, c, direction) {
      let row = r, col = c;
      while (true) {
        const next = this.getNextCell(row, col, direction);
        if (next.row < 0 || next.row >= SIZE ||
            next.col < 0 || next.col >= SIZE) break;
        if (this.grid[next.row][next.col]) break;
        row = next.row; col = next.col;
      }
      return { row, col };
    }

    isGameOver() {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (!this.grid[r][c]) return false;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const v = this.grid[r][c].value;
          if (r < SIZE - 1 && this.grid[r+1][c].value === v) return false;
          if (c < SIZE - 1 && this.grid[r][c+1].value === v) return false;
        }
      }
      return true;
    }

    getGridSnapshot() {
      const snap = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (this.grid[r][c]) snap[r][c] = this.grid[r][c].value;
      return snap;
    }

    showScoreDelta(delta) {
      const card = document.getElementById('score-card');
      const el = document.createElement('div');
      el.className = 'delta';
      el.textContent = '+' + delta;
      card.appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }

    showWin() {
      const toast = document.getElementById('toast');
      toast.className = 'toast win show';
      toast.innerHTML = `2048 达成<span class="small">继续挑战更高数字</span>`;
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    showGameOver() {
      const toast = document.getElementById('toast');
      toast.className = 'toast over show';
      toast.innerHTML = `游戏结束<span class="small">点击「重新开始」再来一次</span>`;
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    updateUI() {
      document.getElementById('score').textContent = this.score;
      document.getElementById('best').textContent = this.best;
    }
  }

  // ====================== AI 算法 ======================
  class AI {
    constructor() {
      this.nodesEvaluated = 0;
    }

    evaluate(grid) {
      let empty = 0, maxVal = 0;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) empty++;
          else if (grid[r][c] > maxVal) maxVal = grid[r][c];
        }
      }

      let score = empty * 280;

      let lr = 0, rl = 0, ud = 0, du = 0;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 3; c++) {
          const cur = grid[r][c] === 0 ? 0 : Math.log2(grid[r][c]);
          const nxt = grid[r][c+1] === 0 ? 0 : Math.log2(grid[r][c+1]);
          if (cur > nxt) lr += nxt - cur;
          else rl += cur - nxt;
        }
      }
      for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 3; r++) {
          const cur = grid[r][c] === 0 ? 0 : Math.log2(grid[r][c]);
          const nxt = grid[r+1][c] === 0 ? 0 : Math.log2(grid[r+1][c]);
          if (cur > nxt) ud += nxt - cur;
          else du += cur - nxt;
        }
      }
      score += (Math.max(lr, rl) + Math.max(ud, du)) * 1.0;

      let smoothness = 0;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] !== 0) {
            const v = Math.log2(grid[r][c]);
            for (let cc = c + 1; cc < 4; cc++) {
              if (grid[r][cc] !== 0) {
                smoothness -= Math.abs(v - Math.log2(grid[r][cc]));
                break;
              }
            }
            for (let rr = r + 1; rr < 4; rr++) {
              if (grid[rr][c] !== 0) {
                smoothness -= Math.abs(v - Math.log2(grid[rr][c]));
                break;
              }
            }
          }
        }
      }
      score += smoothness * 0.1;

      if (maxVal > 0) score += Math.log2(maxVal) * 1.0;

      if (maxVal > 0) {
        const corners = [grid[0][0], grid[0][3], grid[3][0], grid[3][3]];
        if (corners.includes(maxVal)) {
          score += Math.log2(maxVal) * 2.5;
        }
      }

      score += this.snakeBonus(grid) * 1.4;

      return score;
    }

    snakeBonus(grid) {
      const path = [];
      for (let r = 0; r < 4; r++) {
        if (r % 2 === 0) {
          for (let c = 0; c < 4; c++) path.push([r, c]);
        } else {
          for (let c = 3; c >= 0; c--) path.push([r, c]);
        }
      }
      let bonus = 0;
      for (let i = 0; i < path.length - 1; i++) {
        const [r1, c1] = path[i];
        const [r2, c2] = path[i+1];
        const v1 = grid[r1][c1];
        const v2 = grid[r2][c2];
        if (v1 >= v2 && v1 > 0) bonus += Math.log2(v1);
      }
      return bonus;
    }

    // 重写 simulateMove —— 直接按行列合并，避免旋转矩阵的方向 bug
    simulateMove(grid, dir) {
      const newGrid = grid.map(row => [...row]);
      let moved = false;
      let scoreGained = 0;

      // 合并一行/一列（向左方向）
      const compactAndMerge = (line) => {
        const filtered = line.filter(x => x !== 0);
        const result = [];
        for (let i = 0; i < filtered.length; i++) {
          if (i + 1 < filtered.length && filtered[i] === filtered[i+1]) {
            result.push(filtered[i] * 2);
            scoreGained += filtered[i] * 2;
            i++;
          } else {
            result.push(filtered[i]);
          }
        }
        while (result.length < SIZE) result.push(0);
        return result;
      };

      if (dir === 'left') {
        for (let r = 0; r < SIZE; r++) {
          const newRow = compactAndMerge(newGrid[r]);
          for (let c = 0; c < SIZE; c++) {
            if (newGrid[r][c] !== newRow[c]) moved = true;
            newGrid[r][c] = newRow[c];
          }
        }
      } else if (dir === 'right') {
        for (let r = 0; r < SIZE; r++) {
          const reversed = [...newGrid[r]].reverse();
          const newRow = compactAndMerge(reversed).reverse();
          for (let c = 0; c < SIZE; c++) {
            if (newGrid[r][c] !== newRow[c]) moved = true;
            newGrid[r][c] = newRow[c];
          }
        }
      } else if (dir === 'up') {
        for (let c = 0; c < SIZE; c++) {
          const col = [newGrid[0][c], newGrid[1][c], newGrid[2][c], newGrid[3][c]];
          const newCol = compactAndMerge(col);
          for (let r = 0; r < SIZE; r++) {
            if (newGrid[r][c] !== newCol[r]) moved = true;
            newGrid[r][c] = newCol[r];
          }
        }
      } else if (dir === 'down') {
        for (let c = 0; c < SIZE; c++) {
          // 反转列 → 合并 → 反转回来
          const col = [newGrid[3][c], newGrid[2][c], newGrid[1][c], newGrid[0][c]];
          const newCol = compactAndMerge(col).reverse();
          for (let r = 0; r < SIZE; r++) {
            if (newGrid[r][c] !== newCol[r]) moved = true;
            newGrid[r][c] = newCol[r];
          }
        }
      }

      return { grid: newGrid, moved, scoreGained };
    }

    expectimax(grid, depth, isPlayer) {
      this.nodesEvaluated++;
      if (depth === 0) return this.evaluate(grid);

      if (isPlayer) {
        let best = -Infinity;
        let anyMoved = false;
        for (const dir of ['left', 'right', 'up', 'down']) {
          const result = this.simulateMove(grid, dir);
          if (result.moved) {
            anyMoved = true;
            const s = this.expectimax(result.grid, depth - 1, false);
            if (s > best) best = s;
          }
        }
        return anyMoved ? best : this.evaluate(grid) - 200000;
      } else {
        const empty = [];
        for (let r = 0; r < 4; r++)
          for (let c = 0; c < 4; c++)
            if (grid[r][c] === 0) empty.push([r, c]);
        if (empty.length === 0) return this.evaluate(grid);

        let sample = empty;
        if (depth > 2 && empty.length > 4) {
          sample = empty.slice(0, 4);
        }

        let total = 0;
        for (const [r, c] of sample) {
          const g2 = grid.map(row => [...row]);
          g2[r][c] = 2;
          total += 0.9 * this.expectimax(g2, depth - 1, true);
          const g4 = grid.map(row => [...row]);
          g4[r][c] = 4;
          total += 0.1 * this.expectimax(g4, depth - 1, true);
        }
        return total / sample.length;
      }
    }

    getBestMove(grid) {
      this.nodesEvaluated = 0;
      let emptyCount = 0;
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++)
          if (grid[r][c] === 0) emptyCount++;

      let depth = 3;
      if (emptyCount <= 6) depth = 4;
      if (emptyCount <= 3) depth = 5;
      if (emptyCount >= 12) depth = 2;

      const start = performance.now();
      let best = null;
      let bestScore = -Infinity;
      const scores = {};
      const validMoves = [];

      for (const dir of ['left', 'right', 'up', 'down']) {
        const result = this.simulateMove(grid, dir);
        if (result.moved) {
          validMoves.push(dir);
          const s = this.expectimax(result.grid, depth - 1, false);
          scores[dir] = s;
          if (s > bestScore) {
            bestScore = s;
            best = dir;
          }
        }
      }
      const elapsed = performance.now() - start;
      return { move: best, scores, depth, nodes: this.nodesEvaluated, elapsed, validMoves };
    }
  }

  // ====================== 动画工具 ======================
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function animatePosition(mesh, x, z, duration) {
    return new Promise(resolve => {
      const startX = mesh.position.x;
      const startZ = mesh.position.z;
      const start = performance.now();
      function step() {
        const t = Math.min(1, (performance.now() - start) / duration);
        const eased = easeOutQuart(t);
        mesh.position.x = startX + (x - startX) * eased;
        mesh.position.z = startZ + (z - startZ) * eased;
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      }
      step();
    });
  }

  function animateScale(mesh, from, to, duration, callback) {
    const start = performance.now();
    function step() {
      const t = Math.min(1, (performance.now() - start) / duration);
      const eased = easeOutBack(t);
      const s = from + (to - from) * eased;
      mesh.scale.set(s, s, s);
      if (t < 1) requestAnimationFrame(step);
      else if (callback) callback();
    }
    step();
  }

  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // ====================== 粒子 & 轨迹 ======================
  function spawnMergeParticles(x, y, z, value) {
    const count = Math.min(18 + Math.floor(Math.log2(value)) * 4, 48);
    const colorObj = COLORS[value] || COLORS[2048];
    for (let i = 0; i < count; i++) {
      const geo = new THREE.TetrahedronGeometry(0.07 + Math.random() * 0.06);
      const mat = new THREE.MeshBasicMaterial({
        color: colorObj.c, transparent: true, opacity: 1
      });
      const p = new THREE.Mesh(geo, mat);
      p.position.set(x, y, z);
      const angle = Math.random() * Math.PI * 2;
      const upAngle = Math.random() * Math.PI * 0.55;
      const speed = 1.8 + Math.random() * 2.5;
      p.userData = {
        vx: Math.cos(angle) * Math.cos(upAngle) * speed,
        vy: Math.sin(upAngle) * speed + 1.5,
        vz: Math.sin(angle) * Math.cos(upAngle) * speed,
        life: 1,
        rotSpeed: new THREE.Vector3(
          (Math.random() - 0.5) * 12,
          (Math.random() - 0.5) * 12,
          (Math.random() - 0.5) * 12
        )
      };
      boardGroup.add(p);
      particles.push(p);
    }

    const waveGeo = new THREE.RingGeometry(0.1, 0.15, 16);
    const waveMat = new THREE.MeshBasicMaterial({
      color: colorObj.c, transparent: true, opacity: 0.8,
      side: THREE.DoubleSide
    });
    const wave = new THREE.Mesh(waveGeo, waveMat);
    wave.rotation.x = -Math.PI / 2;
    wave.position.set(x, 0.1, z);
    wave.userData = { isWave: true, life: 1, scale: 1 };
    boardGroup.add(wave);
    particles.push(wave);
  }

  function spawnCelebration() {
    for (let i = 0; i < 80; i++) {
      const geo = new THREE.TetrahedronGeometry(0.08 + Math.random() * 0.06);
      const colors = [0xffd700, 0x00ffc8, 0xff5e62, 0xa3e635];
      const mat = new THREE.MeshBasicMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        transparent: true, opacity: 1
      });
      const p = new THREE.Mesh(geo, mat);
      p.position.set(0, 0.5, 0);
      const angle = Math.random() * Math.PI * 2;
      const upAngle = Math.random() * Math.PI * 0.7;
      const speed = 4 + Math.random() * 4;
      p.userData = {
        vx: Math.cos(angle) * Math.cos(upAngle) * speed,
        vy: Math.sin(upAngle) * speed + 3,
        vz: Math.sin(angle) * Math.cos(upAngle) * speed,
        life: 1.5,
        rotSpeed: new THREE.Vector3(
          (Math.random() - 0.5) * 15,
          (Math.random() - 0.5) * 15,
          (Math.random() - 0.5) * 15
        )
      };
      scene.add(p);
      particles.push(p);
    }
  }

  function spawnTrail(fromX, fromZ, toX, toZ, value) {
    const colorObj = COLORS[value] || COLORS[2048];
    const points = [
      new THREE.Vector3(fromX, 0.15, fromZ),
      new THREE.Vector3(toX, 0.15, toZ)
    ];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({
      color: colorObj.c, transparent: true, opacity: 0.85
    });
    const line = new THREE.Line(geo, mat);
    boardGroup.add(line);
    trails.push({ line, life: 1 });
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.userData.life -= dt * 1.3;
      if (p.userData.life <= 0) {
        if (p.parent) p.parent.remove(p);
        p.geometry.dispose(); p.material.dispose();
        particles.splice(i, 1);
        continue;
      }
      if (p.userData.isWave) {
        p.userData.scale += dt * 8;
        p.scale.setScalar(p.userData.scale);
        p.material.opacity = p.userData.life * 0.6;
      } else {
        p.position.x += p.userData.vx * dt;
        p.position.y += p.userData.vy * dt;
        p.position.z += p.userData.vz * dt;
        p.userData.vy -= 9.8 * dt;
        if (p.position.y < 0.05) {
          p.position.y = 0.05;
          p.userData.vy *= -0.4;
          p.userData.vx *= 0.7;
          p.userData.vz *= 0.7;
        }
        p.rotation.x += p.userData.rotSpeed.x * dt;
        p.rotation.y += p.userData.rotSpeed.y * dt;
        p.rotation.z += p.userData.rotSpeed.z * dt;
        p.material.opacity = p.userData.life;
        p.scale.setScalar(Math.max(0.1, p.userData.life));
      }
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      const t = trails[i];
      t.life -= dt * 2.5;
      if (t.life <= 0) {
        if (t.line.parent) t.line.parent.remove(t.line);
        t.line.geometry.dispose(); t.line.material.dispose();
        trails.splice(i, 1);
      } else {
        t.line.material.opacity = t.life * 0.85;
      }
    }
  }

  // ====================== 主循环 ======================
  let game, ai;
  let cameraTime = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    cameraTime += dt;

    camera.position.x = Math.sin(cameraTime * 0.3) * 0.35;
    camera.position.y = 7.5 + Math.sin(cameraTime * 0.45) * 0.12;
    camera.position.z = 6.8 + Math.cos(cameraTime * 0.25) * 0.15;
    camera.lookAt(0, 0, 0);

    if (boardGroup) {
      boardGroup.rotation.y = Math.sin(cameraTime * 0.18) * 0.025;
    }

    if (bgParticles) {
      bgParticles.rotation.y += dt * 0.04;
    }

    decorations.forEach(d => {
      if (d.userData.rotSpeed) {
        d.rotation.x += d.userData.rotSpeed.x * dt;
        d.rotation.y += d.userData.rotSpeed.y * dt;
        d.rotation.z += d.userData.rotSpeed.z * dt;
        d.position.y = d.userData.baseY + 
          Math.sin(cameraTime * d.userData.floatSpeed + d.userData.floatPhase) * 0.3;
      } else if (d.userData.phase !== undefined) {
        d.position.y = d.userData.baseY + 
          Math.sin(cameraTime * 1.5 + d.userData.phase) * 0.15;
        d.rotation.y += dt * 1.2;
      }
    });

    if (game) {
      game.tiles.forEach(t => {
        if (t.mesh.userData.halo) {
          t.mesh.userData.halo.rotation.z += dt * 1.5;
        }
      });
    }

    updateParticles(dt);
    renderer.render(scene, camera);
  }

  // ====================== 事件 ======================
  function setupEvents() {
    document.addEventListener('keydown', (e) => {
      if (game.aiMode || game.isAnimating) return;
      const key = e.key.toLowerCase();
      let dir = null;
      if (key === 'arrowup' || key === 'w') dir = 'up';
      else if (key === 'arrowdown' || key === 's') dir = 'down';
      else if (key === 'arrowleft' || key === 'a') dir = 'left';
      else if (key === 'arrowright' || key === 'd') dir = 'right';
      if (dir) { e.preventDefault(); game.move(dir); }
    });

    let touchStart = null;
    document.addEventListener('touchstart', (e) => {
      if (game.aiMode) return;
      if (e.target.closest('.ui-overlay')) return;
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (!touchStart || game.aiMode) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) < 30 && Math.abs(dy) < 30) { touchStart = null; return; }
      let dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
      else dir = dy > 0 ? 'down' : 'up';
      game.move(dir);
      touchStart = null;
    }, { passive: true });

    let mouseStart = null;
    renderer.domElement.addEventListener('mousedown', (e) => {
      if (game.aiMode) return;
      mouseStart = { x: e.clientX, y: e.clientY };
    });
    document.addEventListener('mouseup', (e) => {
      if (!mouseStart || game.aiMode) return;
      const dx = e.clientX - mouseStart.x;
      const dy = e.clientY - mouseStart.y;
      if (Math.abs(dx) < 30 && Math.abs(dy) < 30) { mouseStart = null; return; }
      let dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
      else dir = dy > 0 ? 'down' : 'up';
      game.move(dir);
      mouseStart = null;
    });

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (mode === 'ai') {
          game.aiMode = true;
          document.getElementById('ai-info').classList.add('active');
          document.getElementById('hint-panel').style.display = 'none';
          if (game.aiTimer) clearTimeout(game.aiTimer);
          game.aiTimer = setTimeout(aiStep, 400);
        } else {
          game.aiMode = false;
          if (game.aiTimer) { clearTimeout(game.aiTimer); game.aiTimer = null; }
          document.getElementById('ai-info').classList.remove('active');
          document.getElementById('hint-panel').style.display = 'block';
        }
      });
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      game.init();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  // ====================== AI 主循环（带防卡死保护） ======================
  async function aiStep() {
    if (!game.aiMode) return;
    if (game.isAnimating) {
      game.aiTimer = setTimeout(aiStep, 80);
      return;
    }
    if (game.gameOver) {
      game.aiMode = true;
      game.init();
      return;
    }

    await sleep(60);
    const grid = game.getGridSnapshot();
    await new Promise(r => setTimeout(r, 0));
    const result = ai.getBestMove(grid);

    document.getElementById('ai-depth').textContent = result.depth;
    document.getElementById('ai-nodes').textContent = result.nodes.toLocaleString();
    const moveMap = { left: '← 左移', right: '→ 右移', up: '↑ 上移', down: '↓ 下移' };
    document.getElementById('ai-move').textContent = result.move ? moveMap[result.move] : '—';
    document.getElementById('depth-fill').style.width =
      Math.min(100, Math.log10(Math.max(1, result.nodes)) * 18) + '%';

    if (result.move) {
      let moved = await game.move(result.move);
      // 防卡死保护：如果首选方向执行失败，遍历其他有效方向
      if (!moved && result.validMoves && result.validMoves.length > 0) {
        for (const dir of result.validMoves) {
          if (dir === result.move) continue;
          moved = await game.move(dir);
          if (moved) {
            document.getElementById('ai-move').textContent = moveMap[dir] + ' (备选)';
            break;
          }
        }
      }
      // 如果所有方向都失败（理论上不会发生），强制检查游戏是否结束
      if (!moved) {
        if (game.isGameOver()) {
          game.gameOver = true;
        }
      }
    } else {
      // 没有有效移动，游戏结束
      game.gameOver = true;
    }
    const delay = Math.max(180, 480 - result.elapsed / 2);
    game.aiTimer = setTimeout(aiStep, delay);
  }

  // ====================== 启动 ======================
  async function start() {
    try {
      await document.fonts.load('900 100px Orbitron');
    } catch (e) {}
    initScene();
    game = new Game();
    ai = new AI();
    setupEvents();
    animate();
  }

  start();
  </script>
</body>
